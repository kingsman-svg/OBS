# 1. SRS独立进程接收/分发媒体；登录、房间与业务信令由OBS server处理。
listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;

# 2. 管理API与HTTP媒体独立端口，避开OBS调度服务的8080。
http_api {
    enabled on;
    listen 1985;
}
http_server {
    enabled on;
    listen 8088;
    dir ./objs/nginx/html;
}

# 3. 预先接好原生RTMP→WebRTC桥接；CANDIDATE必须是客户端可达地址。
rtc_server {
    enabled on;
    listen 8000;
    candidate $CANDIDATE;
}
vhost __defaultVhost__ {
    # 4. 有界首屏缓存，缩短输出等待；自定义缓存/时间戳/重传策略后续基于基线二开。
    min_latency on;
    play {
        gop_cache on;
        queue_length 1;
        mw_latency 0;
    }
    publish {
        mr off;
    }
    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp off;
        nack on;
        twcc on;
    }
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }
}
