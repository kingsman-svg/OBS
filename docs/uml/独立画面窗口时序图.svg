<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1692" viewBox="0 0 1300 1692"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">独立画面窗口时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">用户</text><line x1="130.0" y1="135" x2="130.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MainWindow</text><line x1="390.0" y1="135" x2="390.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SessionController</text><line x1="650.0" y1="135" x2="650.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">PreviewWindow</text><line x1="910.0" y1="135" x2="910.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">VideoRenderer</text><line x1="1170.0" y1="135" x2="1170.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">开始采集</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">captureRequested</text><line x1="650.0" y1="289" x2="390.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="289" x2="403.0" y2="282.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="289" x2="403.0" y2="296.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">首个有效预览 showCapturePreview</text><line x1="390.0" y1="346" x2="910.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="897.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="897.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">setFrame(VideoFrame)</text><line x1="910.0" y1="403" x2="1170.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="403" x2="1157.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="403" x2="1157.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">缓存GPU纹理，show后绘制</text><line x1="130.0" y1="460" x2="910.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="460" x2="897.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="460" x2="897.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">关闭画面窗口</text><line x1="910.0" y1="517" x2="1000.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="517" x2="1000.0" y2="535" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="535" x2="910.0" y2="535" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="535" x2="923.0" y2="528.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="535" x2="923.0" y2="542.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">隐藏，保留最新画面和本轮打开标记</text><line x1="650.0" y1="574" x2="390.0" y2="574" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="574" x2="403.0" y2="567.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="574" x2="403.0" y2="581.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">后续预览帧</text><line x1="390.0" y1="631" x2="910.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="631" x2="897.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="631" x2="897.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">更新缓存，不自动弹窗</text><line x1="130.0" y1="688" x2="390.0" y2="688" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="688" x2="377.0" y2="695.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="688" x2="377.0" y2="681.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">点击打开画面</text><line x1="390.0" y1="745" x2="910.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="745" x2="897.0" y2="752.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="745" x2="897.0" y2="738.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">present 显示最新画面</text><line x1="130.0" y1="802" x2="910.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="802" x2="897.0" y2="809.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="802" x2="897.0" y2="795.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">调整窗口大小</text><line x1="910.0" y1="859" x2="1170.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="859" x2="1157.0" y2="866.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="859" x2="1157.0" y2="852.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">ResizeBuffers后等比绘制留黑边</text><text x="14" y="907" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 停止采集</text><line x1="8" y1="888" x2="1292" y2="888" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="973" x2="390.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="973" x2="403.0" y2="966.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="973" x2="403.0" y2="980.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">showCapturePreview 空帧</text><line x1="390.0" y1="1030" x2="910.0" y2="1030" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1030" x2="897.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1030" x2="897.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">清除GPU资源并隐藏，重置首帧标记</text><line x1="8" y1="1059" x2="1292" y2="1059" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1078" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 退出登录或关闭主窗口</text><line x1="390.0" y1="1144" x2="910.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1144" x2="897.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1144" x2="897.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">清除GPU资源并隐藏</text><line x1="390.0" y1="1201" x2="650.0" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="1201" x2="637.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1201" x2="637.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止采集及会话清理</text><line x1="8" y1="888" x2="8" y2="1236" stroke="#64748b" stroke-width="2" /><line x1="1292" y1="888" x2="1292" y2="1236" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1236" x2="1292" y2="1236" stroke="#64748b" stroke-width="2" /><text x="14" y="1306" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] GPU设备或Shader失败</text><line x1="8" y1="1287" x2="1292" y2="1287" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1372" x2="910.0" y2="1372" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="1372" x2="923.0" y2="1365.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1372" x2="923.0" y2="1379.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">failed</text><line x1="910.0" y1="1429" x2="1000.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1429" x2="1000.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1447" x2="910.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1447" x2="923.0" y2="1440.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1447" x2="923.0" y2="1454.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">保留错误文字，停止后重启可重试</text><line x1="910.0" y1="1486" x2="390.0" y2="1486" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1486" x2="403.0" y2="1479.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1486" x2="403.0" y2="1493.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1475" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">显示预览错误，采集继续</text><line x1="8" y1="1287" x2="8" y2="1521" stroke="#64748b" stroke-width="2" /><line x1="1292" y1="1287" x2="1292" y2="1521" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1521" x2="1292" y2="1521" stroke="#64748b" stroke-width="2" /><rect x="485.5" y="1573" width="329.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="650.0" y="1595" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">主窗口保留操作面板；关闭预览不发出停止采集意图</text></svg>