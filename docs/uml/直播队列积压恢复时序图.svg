<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="2205" viewBox="0 0 1300 2205"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">直播队列积压恢复时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Controller/GUI</text><line x1="130.0" y1="135" x2="130.0" y2="2170" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Publisher队列/锁</text><line x1="390.0" y1="135" x2="390.0" y2="2170" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">现有推流工作线程</text><line x1="650.0" y1="135" x2="650.0" y2="2170" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MediaEncoder</text><line x1="910.0" y1="135" x2="910.0" y2="2170" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">RTMP网络IO</text><line x1="1170.0" y1="135" x2="1170.0" y2="2170" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin，验证预算/清截止点与标记/start</text><text x="14" y="223" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 非法预算或旧线程未退出</text><line x1="8" y1="204" x2="1292" y2="204" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="289" x2="130.0" y2="289" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="289" x2="143.0" y2="282.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="289" x2="143.0" y2="296.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">false，不启动新线程</text><line x1="8" y1="318" x2="1292" y2="318" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="337" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 正常运行</text><line x1="130.0" y1="403" x2="390.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="403" x2="377.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="403" x2="377.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">push同步GPU帧/PCM，记录入队时间</text><line x1="390.0" y1="460" x2="480.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="460" x2="480.0" y2="478" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="478" x2="390.0" y2="478" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="478" x2="403.0" y2="471.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="478" x2="403.0" y2="485.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">检查等待年龄和媒体跨度，高水位触发</text><text x="26" y="508" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 只有视频积压</text><line x1="20" y1="489" x2="1280" y2="489" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="574" x2="480.0" y2="574" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="574" x2="480.0" y2="592" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="592" x2="390.0" y2="592" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="592" x2="403.0" y2="585.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="592" x2="403.0" y2="599.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">跳过旧视频到目标窗口，保留连续音频</text><line x1="20" y1="603" x2="1280" y2="603" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="26" y="622" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 音频也过期</text><line x1="390.0" y1="688" x2="480.0" y2="688" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="688" x2="480.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="706" x2="390.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="706" x2="403.0" y2="699.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="706" x2="403.0" y2="713.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">共同截止点裁剪两路，保留音频追赶标记</text><line x1="20" y1="489" x2="20" y2="723" stroke="#64748b" stroke-width="2" /><line x1="1280" y1="489" x2="1280" y2="723" stroke="#64748b" stroke-width="2" /><line x1="20" y1="723" x2="1280" y2="723" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="802" x2="130.0" y2="802" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="802" x2="143.0" y2="795.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="802" x2="143.0" y2="809.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">立即返回，迟到旧数据不再入队</text><line x1="650.0" y1="859" x2="390.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="859" x2="403.0" y2="852.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="859" x2="403.0" y2="866.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">出队前再次检查时效</text><text x="26" y="907" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 阻塞期间整批过期且无新输入</text><line x1="20" y1="888" x2="1280" y2="888" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="973" x2="390.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="973" x2="403.0" y2="966.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="973" x2="403.0" y2="980.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">清旧数据并等待新媒体，不强留旧帧</text><line x1="20" y1="1002" x2="1280" y2="1002" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="26" y="1021" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 存在可处理媒体</text><line x1="650.0" y1="1087" x2="390.0" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1087" x2="403.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1087" x2="403.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">按PTS取媒体，取走对应追赶标记并解锁</text><line x1="650.0" y1="1144" x2="910.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1144" x2="897.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1144" x2="897.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">视频保留PTS，恢复时请求IDR</text><line x1="650.0" y1="1201" x2="910.0" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1201" x2="897.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1201" x2="897.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">pushAudio，明确liveCatchup</text><text x="38" y="1249" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 主动直播追赶</text><line x1="32" y1="1230" x2="1268" y2="1230" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1315" x2="1000.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1315" x2="1000.0" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1333" x2="910.0" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1333" x2="923.0" y2="1326.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1333" x2="923.0" y2="1340.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">丢未编码FIFO，推进游标，不补回跳过区间</text><line x1="32" y1="1344" x2="1268" y2="1344" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="38" y="1363" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 普通采集缺口</text><line x1="910.0" y1="1429" x2="1000.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1429" x2="1000.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1447" x2="910.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1447" x2="923.0" y2="1440.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1447" x2="923.0" y2="1454.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">原规则检查重叠并补有限静音</text><line x1="32" y1="1230" x2="32" y2="1464" stroke="#64748b" stroke-width="2" /><line x1="1268" y1="1230" x2="1268" y2="1464" stroke="#64748b" stroke-width="2" /><line x1="32" y1="1464" x2="1268" y2="1464" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1543" x2="1170.0" y2="1543" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1543" x2="1157.0" y2="1550.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1543" x2="1157.0" y2="1536.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1532" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">编码包交织写出，网络等待不持队列锁</text><line x1="130.0" y1="1600" x2="390.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1600" x2="377.0" y2="1607.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1600" x2="377.0" y2="1593.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">阻塞时仍可入队/读统计/提交手动码率</text><line x1="1170.0" y1="1657" x2="910.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="1657" x2="923.0" y2="1650.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1657" x2="923.0" y2="1664.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1646" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">写出返回或错误/取消</text><line x1="650.0" y1="1714" x2="390.0" y2="1714" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1714" x2="403.0" y2="1707.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1714" x2="403.0" y2="1721.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1703" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">合并编码统计，下轮重新检查时效</text><line x1="20" y1="888" x2="20" y2="1749" stroke="#64748b" stroke-width="2" /><line x1="1280" y1="888" x2="1280" y2="1749" stroke="#64748b" stroke-width="2" /><line x1="20" y1="1749" x2="1280" y2="1749" stroke="#64748b" stroke-width="2" /><line x1="8" y1="204" x2="8" y2="1806" stroke="#64748b" stroke-width="2" /><line x1="1292" y1="204" x2="1292" y2="1806" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1806" x2="1292" y2="1806" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1885" x2="390.0" y2="1885" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1885" x2="377.0" y2="1892.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1885" x2="377.0" y2="1878.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1874" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，关入口并取消直播IO</text><line x1="650.0" y1="1942" x2="740.0" y2="1942" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="1942" x2="740.0" y2="1960" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="1960" x2="650.0" y2="1960" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1960" x2="663.0" y2="1953.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1960" x2="663.0" y2="1967.0" stroke="#64748b" stroke-width="2" /><text x="658.0" y="1931" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">释放编码/网络资源</text><line x1="650.0" y1="1999" x2="130.0" y2="1999" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="1999" x2="143.0" y2="1992.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1999" x2="143.0" y2="2006.0" stroke="#64748b" stroke-width="2" /><text x="390.0" y="1988" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">completed或failed，随后finished</text><line x1="130.0" y1="2056" x2="390.0" y2="2056" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2056" x2="377.0" y2="2063.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2056" x2="377.0" y2="2049.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="2045" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">下一轮begin清所有截止点与标记</text><rect x="590.0" y="2086" width="380.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="780.0" y="2108" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">仅裁剪编码前原始媒体，不能撤回AAC内部缓存或TCP旧字节</text></svg>