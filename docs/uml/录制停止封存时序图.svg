<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1920" viewBox="0 0 2080 1920"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">录制停止封存时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">用户</text><line x1="130.0" y1="135" x2="130.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Controller/GUI</text><line x1="390.0" y1="135" x2="390.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">采集/检测线程</text><line x1="650.0" y1="135" x2="650.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">混音/同步层</text><line x1="910.0" y1="135" x2="910.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MediaPublisher队列</text><line x1="1170.0" y1="135" x2="1170.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1318.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">编码工作线程</text><line x1="1430.0" y1="135" x2="1430.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1578.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1690.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MediaEncoder</text><line x1="1690.0" y1="135" x2="1690.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1838.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1950.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MP4/临时文件</text><line x1="1950.0" y1="135" x2="1950.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止采集或退出登录</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">请求停止，禁用新一轮</text><text x="14" y="280" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 仍登录的正常停止</text><line x1="8" y1="261" x2="2072" y2="261" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="346" x2="390.0" y2="346" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="346" x2="403.0" y2="339.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="346" x2="403.0" y2="353.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished，最后音频包仍由GUI取走</text><line x1="390.0" y1="403" x2="910.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="403" x2="897.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="403" x2="897.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">混音finish；全部采集/检测退出后同步finish</text><line x1="910.0" y1="460" x2="390.0" y2="460" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="460" x2="403.0" y2="453.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="460" x2="403.0" y2="467.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">最后有界媒体批次</text><line x1="390.0" y1="517" x2="1170.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="517" x2="1157.0" y2="524.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="517" x2="1157.0" y2="510.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">同步尾部快速push</text><line x1="8" y1="546" x2="2072" y2="546" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="565" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 退出登录</text><line x1="390.0" y1="631" x2="910.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="631" x2="897.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="631" x2="897.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">clear，未交付尾部立即丢弃</text><line x1="390.0" y1="688" x2="480.0" y2="688" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="688" x2="480.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="706" x2="390.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="706" x2="403.0" y2="699.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="706" x2="403.0" y2="713.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">迟到媒体不再发同步信号</text><line x1="8" y1="261" x2="8" y2="723" stroke="#64748b" stroke-width="2" /><line x1="2072" y1="261" x2="2072" y2="723" stroke="#64748b" stroke-width="2" /><line x1="8" y1="723" x2="2072" y2="723" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="802" x2="1170.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="802" x2="1157.0" y2="809.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="802" x2="1157.0" y2="795.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，关入口并唤醒</text><line x1="1170.0" y1="859" x2="1260.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="859" x2="1260.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="877" x2="1170.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="877" x2="1183.0" y2="870.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="877" x2="1183.0" y2="884.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">拒绝迟到push</text><line x1="1430.0" y1="916" x2="1170.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1183.0" y2="909.0" s