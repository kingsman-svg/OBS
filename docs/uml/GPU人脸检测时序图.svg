" y2="1251.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">创建专用中间纹理</text><line x1="910.0" y1="1315" x2="1430.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1315" x2="1417.0" y2="1322.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1315" x2="1417.0" y2="1308.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">注册一次CUDA graphics resource</text><line x1="20" y1="1173" x2="20" y2="1350" stroke="#64748b" stroke-width="2" /><line x1="2060" y1="1173" x2="2060" y2="1350" stroke="#64748b" stroke-width="2" /><line x1="20" y1="1350" x2="2060" y2="1350" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1429" x2="1170.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1429" x2="1157.0" y2="1436.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1429" x2="1157.0" y2="1422.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">CopyResource并Flush，视频像素不读回CPU</text><line x1="910.0" y1="1486" x2="1430.0" y2="1486" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1486" x2="1417.0" y2="1493.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1486" x2="1417.0" y2="1479.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1475" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">map，取得array和texture object</text><line x1="910.0" y1="1543" x2="1430.0" y2="1543" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1543" x2="1417.0" y2="1550.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1543" x2="1417.0" y2="1536.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1532" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">CUDA等比缩放补黑、BGRA转RGB、归一化、NCHW</text><line x1="910.0" y1="1600" x2="1430.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1600" x2="1417.0" y2="1607.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1600" x2="1417.0" y2="1593.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">等预处理完成，销毁采样对象并unmap</text><line x1="910.0" y1="1657" x2="1430.0" y2="1657" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1657" x2="1417.0" y2="1664.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1657" x2="1417.0" y2="1650.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1646" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">enqueueV3，同stream读回模型输出并同步</text><line x1="910.0" y1="1714" x2="1000.0" y2="1714" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1714" x2="1000.0" y2="1732" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1732" x2="910.0" y2="1732" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1732" x2="923.0" y2="1725.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1732" x2="923.0" y2="1739.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="1703" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">CPU解码、NMS、还原原图框点</text><line x1="910.0" y1="1771" x2="1000.0" y2="1771" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1771" x2="1000.0" y2="1789" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1789" x2="910.0" y2="1789" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1789" x2="923.0" y2="1782.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1789" x2="923.0" y2="1796.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="1760" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">原子发布FaceFrame，持有同一原始纹理</text><line x1="390.0" y1="1828" x2="910.0" y2="1828" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1828" x2="897.0" y2="1835.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1828" x2="897.0" y2="1821.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1817" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">每33ms取最新完成结果</text><line x1="390.0" y1="1885" x2="1950.0" y2="1885" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1885" x2="1937.0" y2="1892.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1885" x2="1937.0" y2="1878.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1874" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">pushVideo同帧纹理加框点，保留采集QPC</text><line x1="390.0" y1="1942" x2="1950.0" y2="1942" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1942" x2="1937.0" y2="1949.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1942" x2="1937.0" y2="1935.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1931" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">takeFrames，120ms总等待与30fps时间格</text><line x1="1950.0" y1="1999" x2="390.0" y2="1999" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1999" x2="403.0" y2="1992.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1999" x2="403.0" y2="2006.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1988" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">带PTS的同帧数据</text><line x1="390.0" y1="2056" x2="1690.0" y2="2056" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="2056" x2="1677.0" y2="2063.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="2056" x2="1677.0" y2="2049.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="2045" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">同步预览，Shader绘制后Present</text><line x1="8" y1="375" x2="8" y2="2091" stroke="#64748b" stroke-width="2" /><line x1="2072" y1="375" x2="2072" y2="2091" stroke="#64748b" stroke-width="2" /><line x1="8" y1="2091" x2="2072" y2="2091" stroke="#64748b" stroke-width="2" /><text x="14" y="2161" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 设备不支持或反序列化/执行失败</text><line x1="8" y1="2142" x2="2072" y2="2142" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="2227" x2="390.0" y2="2227" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="2227" x2="403.0" y2="2220.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2227" x2="403.0" y2="2234.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="2216" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">failed，释放本轮GPU资源后finished</text><line x1="390.0" y1="2284" x2="1950.0" y2="2284" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="2284" x2="1937.0" y2="2291.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="2284" x2="1937.0" y2="2277.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="2273" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">原帧调度继续，音频和采集继续</text><line x1="8" y1="2313" x2="2072" y2="2313" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="2332" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 停止或退出登录</text><line x1="390.0" y1="2398" x2="910.0" y2="2398" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="2398" x2="897.0" y2="2405.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="2398" x2="897.0" y2="2391.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="2387" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，清空输入/结果并唤醒</text><line x1="910.0" y1="2455" x2="1000.0" y2="2455" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="2455" x2="1000.0" y2="2473" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="2473" x2="910.0" y2="2473" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="2473" x2="923.0" y2="2466.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="2473" x2="923.0" y2="2480.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="2444" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">正在执行的帧完成后也不再发布</text><line x1="910.0" y1="2512" x2="1430.0" y2="2512" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="2512" x2="1417.0" y2="2519.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="2512" x2="1417.0" y2="2505.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="2501" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">同步、注销纹理、释放context/显存/stream</text><line x1="910.0" y1="2569" x2="390.0" y2="2569" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="2569" x2="403.0" y2="2562.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2569" x2="403.0" y2="2576.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="2558" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished，才允许下一轮启动</text><line x1="8" y1="2142" x2="8" y2="2604" stroke="#64748b" stroke-width="2" /><line x1="2072" y1="2142" x2="2072" y2="2604" stroke="#64748b" stroke-width="2" /><line x1="8" y1="2604" x2="2072" y2="2604" stroke="#64748b" stroke-width="2" /><rect x="1121.5" y="2656" width="357.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1300.0" y="2678" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">始终使用同帧结果；GPU耗时与处理耗时、帧龄分别显示</text></svg>