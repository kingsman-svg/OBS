-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">AudioMixer</text><line x1="1430.0" y1="135" x2="1430.0" y2="1543" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">选择麦克风或系统声音，开始采集</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">captureRequested</text><line x1="650.0" y1="289" x2="910.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="289" x2="897.0" y2="296.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="289" x2="897.0" y2="282.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin(source)，两路分别一个实例</text><line x1="910.0" y1="346" x2="1170.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="346" x2="1157.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="346" x2="1157.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">COM MTA / 激活端点 / GetMixFormat</text><line x1="910.0" y1="403" x2="1170.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="403" x2="1157.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="403" x2="1157.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">Initialize共享模式，回环增加LOOPBACK标志</text><text x="14" y="451" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 权限、设备或格式不支持</text><line x1="8" y1="432" x2="1552" y2="432" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="517" x2="910.0" y2="517" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="517" x2="923.0" y2="510.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="517" x2="923.0" y2="524.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">错误</text><line x1="910.0" y1="574" x2="650.0" y2="574" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="574" x2="663.0" y2="567.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="574" x2="663.0" y2="581.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">failed / finished</text><line x1="650.0" y1="631" x2="390.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="631" x2="403.0" y2="624.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="631" x2="403.0" y2="638.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">展示该路错误，其余路独立运行</text><line x1="8" y1="660" x2="1552" y2="660" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="679" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 初始化成功</text><line x1="910.0" y1="745" x2="1170.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="745" x2="1157.0" y2="752.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="745" x2="1157.0" y2="738.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">Start / GetNextPacketSize / GetBuffer</text><line x1="1170.0" y1="802" x2="910.0" y2="802" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="802" x2="923.0" y2="795.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="802" x2="923.0" y2="809.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">原始PCM、声道掩码、标志、首帧QPC时间戳</text><line x1="910.0" y1="859" x2="1000.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="859" x2="1000.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="877" x2="910.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="877" x2="923.0" y2="870.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="877" x2="923.0" y2="884.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">解码为交错Float32，处理静音和不连续</text><line x1="910.0" y1="916" x2="1170.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1157.0" y2="923.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1157.0" y2="909.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">ReleaseBuffer，异常也成对归还</text><line x1="910.0" y1="973" x2="1000.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="973" x2="1000.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="991" x2="910.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="991" x2