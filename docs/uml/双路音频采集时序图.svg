nt-size="14" text-anchor="middle">takeFrames，QPC对齐并输出固定10ms包</text><line x1="1430.0" y1="1258" x2="650.0" y2="1258" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="1258" x2="663.0" y2="1251.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1258" x2="663.0" y2="1265.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">48kHz立体声Float32混音</text><line x1="650.0" y1="1315" x2="740.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="1315" x2="740.0" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="1333" x2="650.0" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1333" x2="663.0" y2="1326.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1333" x2="663.0" y2="1340.0" stroke="#64748b" stroke-width="2" /><text x="658.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">mixedAudioReady，后续接编码</text><line x1="650.0" y1="1372" x2="390.0" y2="1372" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1372" x2="403.0" y2="1365.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1372" x2="403.0" y2="1379.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">原始音量及混音电平/统计显示</text><line x1="8" y1="432" x2="8" y2="1407" stroke="#64748b" stroke-width="2" /><line x1="1552" y1="432" x2="1552" y2="1407" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1407" x2="1552" y2="1407" stroke="#64748b" stroke-width="2" /><rect x="882.0" y="1459" width="316.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1040.0" y="1481" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">输出保留设备采样率和声道；本步不播放回采声音</text></svg>