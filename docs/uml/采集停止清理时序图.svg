<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="951" viewBox="0 0 1560 951"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">采集停止清理时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">用户</text><line x1="130.0" y1="135" x2="130.0" y2="916" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MainWindow</text><line x1="390.0" y1="135" x2="390.0" y2="916" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">PreviewWindow</text><line x1="650.0" y1="135" x2="650.0" y2="916" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SessionController</text><line x1="910.0" y1="135" x2="910.0" y2="916" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">三个采集工作线程</text><line x1="1170.0" y1="135" x2="1170.0" y2="916" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1318.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Windows采集资源</text><line x1="1430.0" y1="135" x2="1430.0" y2="916" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止采集、退出登录或关闭窗口</text><line x1="390.0" y1="232" x2="910.0" y2="232" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="232" x2="897.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="232" x2="897.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stopCaptureRequested 或登录状态变化</text><line x1="910.0" y1="289" x2="1000.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="289" x2="1000.0" y2="307" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="307" x2="910.0" y2="307" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="307" x2="923.0" y2="300.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="307" x2="923.0" y2="314.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">停止交付数据，清空预览</text><line x1="910.0" y1="346" x2="1170.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="346" x2="1157.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="346" x2="1157.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop / requestInterruption</text><line x1="910.0" y1="403" x2="390.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="403" x2="403.0" y2="396.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="403" x2="403.0" y2="410.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">显示正在停止，禁用重新启动</text><line x1="390.0" y1="460" x2="650.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="460" x2="637.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="460" x2="637.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">清空画面并隐藏独立窗口</text><line x1="1170.0" y1="517" x2="1260.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="517" x2="1260.0" y2="535" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="535" x2="1170.0" y2="535" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="535" x2="1183.0" y2="528.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="535" x2="1183.0" y2="542.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">初始化等待或采集轮询检查停止标志</text><line x1="1170.0" y1="574" x2="1430.0" y2="574" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="574" x2="1417.0" y2="581.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="574" x2="1417.0" y2="567.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止及关闭Reader/Session/FramePool/AudioClient</text><line x1="1170.0" y1="631" x2="1260.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="631" x2="1260.0" y2="649" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="649" x2="1170.0" y2="649" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="649" x2="1183.0" y2="642.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="649" x2="1183.0" y2="656.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">释放COM资源后反初始化MTA</text><line x1="1170.0" y1="688" x2="910.0" y2="688" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="688" x2="923.0" y2="681.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="688" x2="923.0" y2="695.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished</text><line x1="910.0" y1="745" x2="1000.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="745" x2="1000.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="763" x2="910.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="763" x2="923.0" y2="756.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="763" x2="923.0" y2="770.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">移除未完成线程；保留失败说明</text><line x1="910.0" y1="802" x2="390.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="802" x2="403.0" y2="795.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="802" x2="403.0" y2="809.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">已停止，登录状态允许时可重新选择</text><rect x="832.0" y="832" width="416.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1040.0" y="854" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">GUI启停不wait；控制器析构必须wait，保证线程不访问已销毁对象</text></svg>