<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1692" viewBox="0 0 2080 1692"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">采集停止清理时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">用户</text><line x1="130.0" y1="135" x2="130.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MainWindow</text><line x1="390.0" y1="135" x2="390.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">PreviewWindow</text><line x1="650.0" y1="135" x2="650.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">VideoRenderer</text><line x1="910.0" y1="135" x2="910.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SessionController</text><line x1="1170.0" y1="135" x2="1170.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1318.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">三个采集工作线程</text><line x1="1430.0" y1="135" x2="1430.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1578.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1690.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Windows采集资源</text><line x1="1690.0" y1="135" x2="1690.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1838.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1950.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">AudioMixer</text><line x1="1950.0" y1="135" x2="1950.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止采集或退出登录</text><line x1="390.0" y1="232" x2="1170.0" y2="232" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="232" x2="1157.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="232" x2="1157.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stopCaptureRequested 或登录状态变化</text><line x1="1170.0" y1="289" x2="1260.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="289" x2="1260.0" y2="307" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="307" x2="1170.0" y2="307" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="307" x2="1183.0" y2="300.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="307" x2="1183.0" y2="314.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">停止视频/普通音频交付，清空预览</text><line x1="1170.0" y1="346" x2="1430.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="346" x2="1417.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="346" x2="1417.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop / requestInterruption</text><line x1="1170.0" y1="403" x2="390.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="403" x2="403.0" y2="396.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="403" x2="403.0" y2="410.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">显示正在停止，禁用重新启动</text><line x1="390.0" y1="460" x2="650.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="460" x2="637.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="460" x2="637.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">清空画面并隐藏独立窗口</text><line x1="650.0" y1="517" x2="910.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="517" x2="897.0" y2="524.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="517" x2="897.0" y2="510.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">clear，释放SRV/RTV/SwapChain和帧引用</text><text x="14" y="565" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 退出登录或登录失效</text><line x1="8" y1="546" x2="2072" y2="546" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="631" x2="1950.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="631" x2="1937.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="631" x2="1937.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">clear，立即丢弃缓存与滤波尾部</text><line x1="8" y1="660" x2="2072" y2="660" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="679" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 普通停止</text><line x1="1170.0" y1="745" x2="1260.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="745" x2="1260.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="763" x2="1170.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="763" x2="1183.0" y2="756.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="763" x2="1183.0" y2="770.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">保留音频尾部，等线程结束后排空</text><line x1="8" y1="546" x2="8" y2="780" stroke="#64748b" stroke-width="2" /><line x1="2072" y1="546" x2="2072" y2="780" stroke="#64748b" stroke-width="2" /><line x1="8" y1="780" x2="2072" y2="780" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="859" x2="1520.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="859" x2="1520.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="877" x2="1430.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="877" x2="1443.0" y2="870.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="877" x2="1443.0" y2="884.0" stroke="#64748b" stroke-width="2" /><text x="1438.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">初始化等待或采集轮询检查停止标志</text><line x1="1430.0" y1="916" x2="1690.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="916" x2="1677.0" y2="923.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="916" x2="1677.0" y2="909.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止及关闭Reader/Session/FramePool/AudioClient</text><line x1="1430.0" y1="973" x2="1520.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="973" x2="1520.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="991" x2="1430.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="991" x2="1443.0" y2="984.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="991" x2="1443.0" y2="998.0" stroke="#64748b" stroke-width="2" /><text x="1438.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">释放COM资源后反初始化MTA</text><line x1="1430.0" y1="1030" x2="1170.0" y2="1030" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="1030" x2="1183.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1030" x2="1183.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished</text><line x1="1170.0" y1="1087" x2="1260.0" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1087" x2="1260.0" y2="1105" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1105" x2="1170.0" y2="1105" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1105" x2="1183.0" y2="1098.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1105" x2="1183.0" y2="1112.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">取走最后采集包，再移除未完成线程</text><text x="14" y="1135" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 普通停止且两路音频均退出</text><line x1="8" y1="1116" x2="2072" y2="1116" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1201" x2="1950.0" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1201" x2="1937.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1201" x2="1937.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finish，排空重采样尾部和最后补零包</text><line x1="1950.0" y1="1258" x2="1170.0" y2="1258" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="1258" x2="1183.0" y2="1251.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1258" x2="1183.0" y2="1265.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">最后的固定10ms输出</text><line x1="1170.0" y1="1315" x2="1260.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1315" x2="1260.0" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1333" x2="1170.0" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1333" x2="1183.0" y2="1326.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1333" x2="1183.0" y2="1340.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">emit mixedAudioReady</text><line x1="8" y1="1344" x2="2072" y2="1344" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1363" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 已退出登录</text><line x1="1170.0" y1="1429" x2="1260.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1429" x2="1260.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1447" x2="1170.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1447" x2="1183.0" y2="1440.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1447" x2="1183.0" y2="1454.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">丢弃迟到包，不交付混音</text><line x1="8" y1="1116" x2="8" y2="1464" stroke="#64748b" stroke-width="2" /><line x1="2072" y1="1116" x2="2072" y2="1464" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1464" x2="2072" y2="1464" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1543" x2="390.0" y2="1543" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1543" x2="403.0" y2="1536.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1543" x2="403.0" y2="1550.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1532" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">已停止，登录状态允许时可重新选择</text><rect x="1116.5" y="1573" width="367.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1300.0" y="1595" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">关闭程序时控制器析构wait并释放滤波器；不保证尾部交付</text></svg>