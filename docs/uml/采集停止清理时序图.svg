f" font-size="14" text-anchor="start">[alt] 普通停止且两路音频均退出</text><line x1="8" y1="1230" x2="2852" y2="1230" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1315" x2="1950.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1315" x2="1937.0" y2="1322.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1315" x2="1937.0" y2="1308.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finish，排空重采样尾部和最后补零包</text><line x1="1950.0" y1="1372" x2="1170.0" y2="1372" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="1372" x2="1183.0" y2="1365.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1372" x2="1183.0" y2="1379.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">最后的固定10ms输出</text><line x1="1170.0" y1="1429" x2="1260.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1429" x2="1260.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1447" x2="1170.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1447" x2="1183.0" y2="1440.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1447" x2="1183.0" y2="1454.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">emit mixedAudioReady</text><line x1="1170.0" y1="1486" x2="2730.0" y2="1486" stroke="#64748b" stroke-width="2" /><line x1="2730.0" y1="1486" x2="2717.0" y2="1493.0" stroke="#64748b" stroke-width="2" /><line x1="2730.0" y1="1486" x2="2717.0" y2="1479.0" stroke="#64748b" stroke-width="2" /><text x="1950.0" y="1475" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">pushAudio尾部，尚不恢复普通交付</text><line x1="8" y1="1515" x2="2852" y2="1515" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1534" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 已退出登录</text><line x1="1170.0" y1="1600" x2="1260.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1600" x2="1260.0" y2="1618" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1618" x2="1170.0" y2="1618" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1618" x2="1183.0" y2="1611.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1618" x2="1183.0" y2="1625.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">丢弃迟到包，不交付混音</text><line x1="8" y1="1230" x2="8" y2="1635" stroke="#64748b" stroke-width="2" /><line x1="2852" y1="1230" x2="2852" y2="1635" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1635" x2="2852" y2="1635" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1714" x2="390.0" y2="1714" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1714" x2="403.0" y2="1707.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1714" x2="403.0" y2="1721.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1703" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">采集已退出，等待检测线程清理</text><line x1="2210.0" y1="1771" x2="2300.0" y2="1771" stroke="#64748b" stroke-width="2" /><line x1="2300.0" y1="1771" x2="2300.0" y2="1789" stroke="#64748b" stroke-width="2" /><line x1="2300.0" y1="1789" x2="2210.0" y2="1789" stroke="#64748b" stroke-width="2" /><line x1="2210.0" y1="1789" x2="2223.0" y2="1782.0" stroke="#64748b" stroke-width="2" /><line x1="2210.0" y1="1789" x2="2223.0" y2="1796.0" stroke="#64748b" stroke-width="2" /><text x="2218.0" y="1760" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">已提交GPU任务完成后丢弃迟到结果</text><line x1="2210.0" y1="1828" x2="2470.0" y2="1828" stroke="#64748b" stroke-width="2" /><line x1="2470.0" y1="1828" x2="2457.0" y2="1835.0" stroke="#64748b" stroke-width="2" /><line x1="2470.0" y1="1828" x2="2457.0" y2="1821.0" stroke="#64748b" stroke-width="2" /><text x="2340.0" y="1817" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">同步、注销中间纹理、释放推理和显存资源</text><line x1="2210.0" y1="1885" x2="1170.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="1885" x2="1183.0" y2="1878.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1885" x2="1183.0" y2="1892.0" stroke="#64748b" stroke-width="2" /><text x="1690.0" y="1874" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished，移除未完成线程</text><line x1="1170.0" y1="1942" x2="2730.0" y2="1942" stroke="#64748b" stroke-width="2" /><line x1="2730.0" y1="1942" x2="2717.0" y2="1949.0" stroke="#64748b" stroke-width="2" /><line x1="2730.0" y1="1942" x2="2717.0" y2="1935.0" stroke="#64748b" stroke-width="2" /><text x="1950.0" y="1931" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">全部线程退出后finish，退出登录则clear</text><line x1="2730.0" y1="1999" x2="1170.0" y2="1999" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="1999" x2="1183.0" y2="1992.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1999" x2="1183.0" y2="2006.0" stroke="#64748b" stroke-width="2" /><text x="1950.0" y="1988" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">最后同步批次，最多保留500ms</text><line x1="1170.0" y1="2056" x2="1260.0" y2="2056" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="2056" x2="1260.0" y2="2074" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="2074" x2="1170.0" y2="2074" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="2074" x2="1183.0" y2="2067.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="2074" x2="1183.0" y2="2081.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="2045" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">发同步尾部信号，预览不重新打开</text><line x1="1170.0" y1="2113" x2="390.0" y2="2113" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2113" x2="403.0" y2="2106.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2113" x2="403.0" y2="2120.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="2102" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">全部已停止，登录状态允许时可重新选择</text><rect x="1501.5" y="2143" width="377.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1690.0" y="2165" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">采集与检测全部finished后才解锁重新启动；GUI不等待GPU</text><rect x="1116.5" y="2200" width="367.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1300.0" y="2222" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">关闭程序时控制器析构wait并释放滤波器；不保证尾部交付</text></svg>