48b" stroke-width="2" /><line x1="2730.0" y1="745" x2="2717.0" y2="752.0" stroke="#64748b" stroke-width="2" /><line x1="2730.0" y1="745" x2="2717.0" y2="738.0" stroke="#64748b" stroke-width="2" /><text x="1950.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">clear，立即丢弃同步队列和纹理</text><line x1="8" y1="774" x2="2852" y2="774" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="793" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 普通停止</text><line x1="1170.0" y1="859" x2="1260.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="859" x2="1260.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="877" x2="1170.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="877" x2="1183.0" y2="870.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="877" x2="1183.0" y2="884.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">保留音频尾部，等线程结束后排空</text><line x1="8" y1="603" x2="8" y2="894" stroke="#64748b" stroke-width="2" /><line x1="2852" y1="603" x2="2852" y2="894" stroke="#64748b" stroke-width="2" /><line x1="8" y1="894" x2="2852" y2="894" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="973" x2="1520.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="973" x2="1520.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="991" x2="1430.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="991" x2="1443.0" y2="984.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="991" x2="1443.0" y2="998.0" stroke="#64748b" stroke-width="2" /><text x="1438.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">初始化等待或采集轮询检查停止标志</text><line x1="1430.0" y1="1030" x2="1690.0" y2="1030" stroke="#64748b" stroke