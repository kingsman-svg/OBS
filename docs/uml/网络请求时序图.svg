<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1179" viewBox="0 0 1300 1179"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">网络请求时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">调用方</text><line x1="130.0" y1="135" x2="130.0" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">HttpClient</text><line x1="390.0" y1="135" x2="390.0" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">QNetworkAccessManager</text><line x1="650.0" y1="135" x2="650.0" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">QNetworkReply + QTimer</text><line x1="910.0" y1="135" x2="910.0" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">HTTP 服务</text><line x1="1170.0" y1="135" x2="1170.0" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">getJson 或 postJson</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">get 或 post(JSON request)</text><line x1="650.0" y1="289" x2="910.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="289" x2="897.0" y2="296.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="289" x2="897.0" y2="282.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">create reply</text><line x1="390.0" y1="346" x2="910.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="897.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="897.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">start per-request timer</text><line x1="390.0" y1="403" x2="130.0" y2="403" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="403" x2="143.0" y2="396.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="403" x2="143.0" y2="410.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">requestId</text><line x1="650.0" y1="460" x2="1170.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="460" x2="1157.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="460" x2="1157.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">HTTP GET 或 POST</text><text x="14" y="508" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] HTTP 响应完成</text><line x1="8" y1="489" x2="1292" y2="489" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="574" x2="910.0" y2="574" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="574" x2="923.0" y2="567.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="574" x2="923.0" y2="581.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">status + response bytes</text><line x1="910.0" y1="631" x2="390.0" y2="631" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="631" x2="403.0" y2="624.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="631" x2="403.0" y2="638.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished()</text><line x1="390.0" y1="688" x2="910.0" y2="688" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="688" x2="897.0" y2="695.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="688" x2="897.0" y2="681.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop timer, read body, deleteLater()</text><line x1="390.0" y1="745" x2="130.0" y2="745" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="745" x2="143.0" y2="738.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="745" x2="143.0" y2="752.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">succeeded(id, status, JSON) or failed(id, message, status)</text><line x1="8" y1="774" x2="1292" y2="774" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="793" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 请求超时</text><line x1="910.0" y1="859" x2="390.0" y2="859" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="859" x2="403.0" y2="852.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="859" x2="403.0" y2="866.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">timer timeout</text><line x1="390.0" y1="916" x2="910.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="916" x2="897.0" y2="923.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="916" x2="897.0" y2="909.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">mark timeout, abort()</text><line x1="910.0" y1="973" x2="390.0" y2="973" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="973" x2="403.0" y2="966.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="973" x2="403.0" y2="980.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished()</text><line x1="390.0" y1="1030" x2="130.0" y2="1030" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="1030" x2="143.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1030" x2="143.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-s