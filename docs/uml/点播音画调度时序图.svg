="220.0" y1="1885" x2="220.0" y2="1903" stroke="#64748b" stroke-width="2" /><line x1="220.0" y1="1903" x2="130.0" y2="1903" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1903" x2="143.0" y2="1896.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1903" x2="143.0" y2="1910.0" stroke="#64748b" stroke-width="2" /><text x="138.0" y="1874" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">从音频结束位置按QPC继续视频尾部</text><line x1="8" y1="1743" x2="8" y2="1920" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="1743" x2="1812" y2="1920" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1920" x2="1812" y2="1920" stroke="#64748b" stroke-width="2" /><rect x="992.5" y="1972" width="355.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1170.0" y="1994" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">关闭独立画面仅隐藏，后续帧继续更新缓存，不停止声音</text></svg>