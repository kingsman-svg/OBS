 stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="688" x2="480.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="706" x2="390.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="706" x2="403.0" y2="699.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="706" x2="403.0" y2="713.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">音频SWR转48kHz立体声Float32，实际样本数推进PTS</text><text x="14" y="736" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 本轮启用声音</text><line x1="8" y1="717" x2="1812" y2="717" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="802" x2="910.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="802" x2="897.0" y2="809.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="802" x2="897.0" y2="795.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">有界PCM入队，最多1秒</text><line x1="910.0" y1="859" x2="1000.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="859" x2="1000.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="877" x2="910.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="877" x2="923.0" y2="870.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="877" x2="923.0" y2="884.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">100ms预缓冲、保留PTS缺口/前置静音</text><line x1="910.0" y1="916" x2="1170.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1157.0" y2="923.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1157.0" y2="909.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="905" fill="#1e293b" font-family="Microsoft Y