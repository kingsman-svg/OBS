1812" y2="1179" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1179" x2="1812" y2="1179" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1258" x2="130.0" y2="1258" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1258" x2="143.0" y2="1251.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1258" x2="143.0" y2="1265.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">每10ms takeVideo</text><line x1="130.0" y1="1315" x2="910.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1315" x2="897.0" y2="1322.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1315" x2="897.0" y2="1308.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">快速复制音频时钟；没有输出则用QPC</text><text x="14" y="1363" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 视频PTS尚未到期</text><line x1="8" y1="1344" x2="1812" y2="1344" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1429" x2="1430.0" y2="1429" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1430.0" y1="1429" x2="1417.0" y2="1436.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1429" x2="1417.0" y2="1422.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">空纹理，保留当前画面并等待</text><line x1="8" y1="1458" x2="1812" y2="1458" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1477" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 到期帧</text><line x1="130.0" y1="1543" x2="650.0" y2="1543" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1543" x2="637.0" y2="1550.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1543" x2="63