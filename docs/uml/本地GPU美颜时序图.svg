1144" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1144" x2="1677.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1144" x2="1677.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">pushVideo，按原QPC与音频统一调度</text><line x1="1690.0" y1="1201" x2="390.0" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1201" x2="403.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1201" x2="403.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">TimedVideoFrame，固定PTS</text><line x1="390.0" y1="1258" x2="1950.0" y2="1258" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1258" x2="1937.0" y2="1265.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1258" x2="1937.0" y2="1251.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">同一美颜纹理，预览与编码共享结果</text><line x1="1950.0" y1="1315" x2="2040.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="2040.0" y1="1315" x2="2040.0" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="2040.0" y1="1333" x2="1950.0" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1333" x2="1963.0" y2="1326.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1333" x2="1963.0" y2="1340.0" stroke="#64748b" stroke-width="2" /><text x="1690.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">可选诊断框点，NVENC录制/RTMP输出</text><line x1="130.0" y1="1372" x2="390.0" y2="1372" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1372" x2="377.0" y2="1379.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1372" x2="377.0" y2="1365.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">实时调整磨皮/提亮</text><line x1="390.0" y1="1429" x2="910.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1429" x2="897.0" y2="1436.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1429" x2="897.0" y2="1422.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">setBeautyStrength，下一帧读取</text><text x="14" y="1477" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 模型/设备/美颜失败</text><line x1="8" y1="1458" x2="2072" y2="1458" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1543" x2="390.0" y2="1543" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1543" x2="403.0" y2="1536.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1543" x2="403.0" y2="1550.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1532" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">failed，资源清理后finished</text><line x1="390.0" y1="1600" x2="1690.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1600" x2="1677.0" y2="1607.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1600" x2="1677.0" y2="1593.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">恢复原帧，音频继续，停止后可重试</text><line x1="8" y1="1629" x2="2072" y2="1629" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1648" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 停止/退出登录</text><line x1="390.0" y1="1714" x2="650.0" y2="1714" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1714" x2="637.0" y2="1721.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1714" x2="637.0" y2="1707.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1703" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop</text><line x1="390.0" y1="1771" x2="910.0" y2="1771" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1771" x2="897.0" y2="1778.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1771" x2="897.0" y2="1764.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1760" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，清邮箱、请求中断</text><line x1="910.0" y1="1828" x2="1430.0" y2="1828" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1828" x2="1417.0" y2="1835.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1828" x2="1417.0" y2="1821.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1817" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">GPU完成查询观察取消，释放私有资源</text><line x1="910.0" y1="1885" x2="1170.0" y2="1885" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1885" x2="1157.0" y2="1892.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1885" x2="1157.0" y2="1878.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1874" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">完成同步，注销互操作并释放模型资源</text><line x1="910.0" y1="1942" x2="390.0" y2="1942" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1942" x2="403.0" y2="1935.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1942" x2="403.0" y2="1949.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1931" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished，才允许下一轮</text><line x1="8" y1="1458" x2="8" y2="1977" stroke="#64748b" stroke-width="2" /><line x1="2072" y1="1458" x2="2072" y2="1977" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1977" x2="2072" y2="1977" stroke="#64748b" stroke-width="2" /><rect x="1264.0" y="2029" width="332.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1430.0" y="2051" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">图像一直在GPU，只有模型输出张量进入CPU后处理</text></svg>