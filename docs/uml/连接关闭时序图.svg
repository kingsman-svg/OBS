<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1350" viewBox="0 0 1300 1350"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">连接关闭时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">TCP 对端</text><line x1="130.0" y1="135" x2="130.0" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">TcpConnection</text><line x1="390.0" y1="135" x2="390.0" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Channel / Poller</text><line x1="650.0" y1="135" x2="650.0" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">TcpServer</text><line x1="910.0" y1="135" x2="910.0" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">业务服务</text><line x1="1170.0" y1="135" x2="1170.0" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">shutdown(SHUT_WR)，服务端读到 EOF</text><line x1="390.0" y1="232" x2="1170.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="232" x2="1157.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="232" x2="1157.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">先通知最后一批输入字节</text><line x1="1170.0" y1="289" x2="390.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="289" x2="403.0" y2="282.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="289" x2="403.0" y2="296.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">send(response)</text><line x1="390.0" y1="346" x2="480.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="346" x2="480.0" y2="364" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="364" x2="390.0" y2="364" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="364" x2="403.0" y2="357.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="364" x2="403.0" y2="371.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">状态 Disconnecting，停止读取</text><text x="14" y="394" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 存在待发送数据</text><line x1="8" y1="375" x2="1292" y2="375" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="460" x2="390.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="460" x2="403.0" y2="453.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="460" x2="403.0" y2="467.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">EPOLLOUT 驱动剩余数据发送</text><line x1="390.0" y1="517" x2="130.0" y2="517" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="517" x2="143.0" y2="510.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="517" x2="143.0" y2="524.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">输出全部排空</text><line x1="8" y1="546" x2="1292" y2="546" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="565" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 输出已排空</text><line x1="390.0" y1="631" x2="480.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="631" x2="480.0" y2="649" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="649" x2="390.0" y2="649" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="649" x2="403.0" y2="642.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="649" x2="403.0" y2="656.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">立即进入关闭路径</text><line x1="8" y1="375" x2="8" y2="666" stroke="#64748b" stroke-width="2" /><line x1="1292" y1="375" x2="1292" y2="666" stroke="#64748b" stroke-width="2" /><line x1="8" y1="666" x2="1292" y2="666" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="745" x2="650.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="745" x2="637.0" y2="752.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="745" x2="637.0" y2="738.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">disableAll()，移除 token</text><line x1="390.0" y1="802" x2="480.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="802" x2="480.0" y2="820" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="820" x2="390.0" y2="820" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="820" x2="403.0" y2="813.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="820" x2="403.0" y2="827.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">Disconnected，关闭 fd，清空 Buffer</text><line x1="390.0" y1="859" x2="910.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="859" x2="897.0" y2="866.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="859" x2="897.0" y2="852.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">closeCallback(conn, reason)</text><line x1="910.0" y1="916" x2="1000.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="916" x2="1000.0" y2="934" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="934" x2="910.0" y2="934" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="934" x2="923.0" y2="927.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="934" x2="923.0" y2="941.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">从连接集合移除</text><line x1="910.0" y1="973" x2="1170.0" y2="973" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="973" x2="1157.0" y2="980.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="973" x2="1157.0" y2="966.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">disconnectCallback()</text><rect x="258.0" y="1003" width="264.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="390.0" y="1025" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">对象保活到回调结束；重复关闭无副作用</text><line x1="1170.0" y1="1087" x2="910.0" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1087" x2="923.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1087" x2="923.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop()，也允许在连接或消息回调内调用</text><line x1="910.0" y1="1144" x2="650.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1144" x2="663.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1144" x2="663.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止并移除监听订阅</text><line x1="910.0" y1="1201" x2="390.0" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1201" x2="403.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1201" x2="403.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">解除业务回调，forceClose 所有连接</text><rect x="714.0" y="1231" width="392.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="910.0" y="1253" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">stop 不再发送断开通知；活跃事件遇到已禁用 Channel 会跳过</text></svg>