<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1236" viewBox="0 0 1100 1236"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">本地认证时序图</text><rect x="25.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="137.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">main</text><line x1="137.5" y1="135" x2="137.5" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="300.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="412.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">LocalAuthServer</text><line x1="412.5" y1="135" x2="412.5" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="575.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="687.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MainWindow</text><line x1="687.5" y1="135" x2="687.5" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="850.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="962.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">HttpClient</text><line x1="962.5" y1="135" x2="962.5" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="137.5" y1="175" x2="412.5" y2="175" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="275.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">start() 监听 127.0.0.1 随机端口</text><text x="14" y="223" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 监听成功</text><line x1="8" y1="204" x2="1092" y2="204" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="289" x2="137.5" y2="289" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="137.5" y1="289" x2="150.5" y2="282.0" stroke="#64748b" stroke-width="2" /><line x1="137.5" y1="289" x2="150.5" y2="296.0" stroke="#64748b" stroke-width="2" /><text x="275.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">endpoint()</text><line x1="137.5" y1="346" x2="687.5" y2="346" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="346" x2="674.5" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="346" x2="674.5" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="412.5" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">setLoginEndpoint(endpoint)</text><line x1="8" y1="375" x2="1092" y2="375" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="394" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 监听失败</text><line x1="137.5" y1="460" x2="687.5" y2="460" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="460" x2="674.5" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="460" x2="674.5" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="412.5" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">applyLoginState(启动失败)</text><line x1="8" y1="204" x2="8" y2="495" stroke="#64748b" stroke-width="2" /><line x1="1092" y1="204" x2="1092" y2="495" stroke="#64748b" stroke-width="2" /><line x1="8" y1="495" x2="1092" y2="495" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="574" x2="412.5" y2="574" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="574" x2="425.5" y2="567.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="574" x2="425.5" y2="581.0" stroke="#64748b" stroke-width="2" /><text x="687.5" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">POST /auth/login (JSON)</text><line x1="412.5" y1="631" x2="502.5" y2="631" stroke="#64748b" stroke-width="2" /><line x1="502.5" y1="631" x2="502.5" y2="649" stroke="#64748b" stroke-width="2" /><line x1="502.5" y1="649" x2="412.5" y2="649" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="649" x2="425.5" y2="642.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="649" x2="425.5" y2="656.0" stroke="#64748b" stroke-width="2" /><text x="420.5" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">异步累积请求，校验方法、路径、长度、JSON</text><text x="14" y="679" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 完整请求且 root / root 匹配</text><line x1="8" y1="660" x2="1092" y2="660" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="745" x2="962.5" y2="745" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="962.5" y1="745" x2="949.5" y2="752.0" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="745" x2="949.5" y2="738.0" stroke="#64748b" stroke-width="2" /><text x="687.5" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">200 token、用户、expiresIn</text><line x1="8" y1="774" x2="1092" y2="774" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="793" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 账号或密码错误</text><line x1="412.5" y1="859" x2="962.5" y2="859" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="962.5" y1="859" x2="949.5" y2="866.0" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="859" x2="949.5" y2="852.0" stroke="#64748b" stroke-width="2" /><text x="687.5" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">401 INVALID_CREDENTIALS</text><line x1="8" y1="888" x2="1092" y2="888" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="907" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 无效协议、路径、方法或大小</text><line x1="412.5" y1="973" x2="962.5" y2="973" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="962.5" y1="973" x2="949.5" y2="980.0" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="973" x2="949.5" y2="966.0" stroke="#64748b" stroke-width="2" /><text x="687.5" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">400 / 404 / 405 / 413</text><line x1="8" y1="660" x2="8" y2="1008" stroke="#64748b" stroke-width="2" /><line x1="1092" y1="660" x2="1092" y2="1008" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1008" x2="1092" y2="1008" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="1087" x2="502.5" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="502.5" y1="1087" x2="502.5" y2="1105" stroke="#64748b" stroke-width="2" /><line x1="502.5" y1="1105" x2="412.5" y2="1105" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="1105" x2="425.5" y2="1098.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="1105" x2="425.5" y2="1112.0" stroke="#64748b" stroke-width="2" /><text x="420.5" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">关闭连接并释放 socket</text><rect x="230.0" y="1117" width="365.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="412.5" y="1139" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">未完整接收等待后续数据；5 秒超时关闭；最多 16 个连接</text></svg>