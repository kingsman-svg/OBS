stroke-width="2" /><text x="558.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">记录本段QPC原点及不连续标记</text><line x1="20" y1="831" x2="1080" y2="831" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="26" y="850" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 时间连续</text><line x1="550.0" y1="916" x2="640.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="640.0" y1="916" x2="640.0" y2="934" stroke="#64748b" stroke-width="2" /><line x1="640.0" y1="934" x2="550.0" y2="934" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="934" x2="563.0" y2="927.0" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="934" x2="563.0" y2="941.0" stroke="#64748b" stroke-width="2" /><text x="558.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">累计样本时钟，吸收小幅时间抖动</text><line x1="20" y1="546" x2="20" y2="951" stroke="#64748b" stroke-width="2" /><line x1="1080" y1="546" x2="1080" y2="951" stroke="#64748b" stroke-width="2" /><line x1="20" y1="951" x2="1080" y2="951" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="1030" x2="916.6666666666666" y2="1030" stroke="#64748b" stroke-width="2" /><line x1="916.6666666666666" y1="1030" x2="903.6666666666666" y2="1037.0" stroke="#64748b" stroke-width="2" /><line x1="916.6666666666666" y1="1030" x2="903.6666666666666" y2="1023.0" stroke="#64748b" stroke-width="2" /><text x="733.3333333333333" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">swr_get_out_samples，预留含滤波延迟的容量</text><line x1="550.0" y1="1087" x2="916.6666666666666" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="916.6666666666666" y1="1087" x2="903.6666666666666" y2="1094.0" stroke="#64748b" stroke-width="2" /><line x1="916.6666666666666" y1="1087" x2="903.6666666666666" y2="1080.0" stroke="#64748b" stroke-width="2" /><text x="733.3333333333333" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">swr_convert，输入交错Float32</text><line x1="916.6666666666666" y1="1144" x2="550.0" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="550.0" y1="1144" x2="563.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="1144" x2="563.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><text x="733.3333333333333" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">可变数量的立体声Float32帧</text><line x1="550.0" y1="1201" x2="640.0" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="640.0" y1="1201" x2="640.0" y2="1219" stroke="#64748b" stroke-width="2" /><line x1="640.0" y1="1219" x2="550.0" y2="1219" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="1219" x2="563.0" y2="1212.0" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="1219" x2="563.0" y2="1226.0" stroke="#64748b" stroke-width="2" /><text x="558.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">按本段实际输出样本数计算QPC时间</text><line x1="550.0" y1="1258" x2="183.33333333333334" y2="1258" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="183.33333333333334" y1="1258" x2="196.33333333333334" y2="1251.0" stroke="#64748b" stroke-width="2" /><line x1="183.33333333333334" y1="1258" x2="196.33333333333334" y2="1265.0" stroke="#64748b" stroke-width="2" /><text x="366.6666666666667" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">转换包，保留不连续/估计时间标记</text><line x1="8" y1="261" x2="8" y2="1293" stroke="#64748b" stroke-width="2" /><line x1="1092" y1="261" x2="1092" y2="1293" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1293" x2="1092" y2="1293" stroke="#64748b" stroke-width="2" /><rect x="555.8333333333333" y="1345" width="355.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="73