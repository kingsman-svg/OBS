<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1464" viewBox="0 0 1100 1464"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">音频重采样时序图</text><rect x="71.33333333333334" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="183.33333333333334" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">AudioMixer</text><line x1="183.33333333333334" y1="135" x2="183.33333333333334" y2="1429" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="438.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="550.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">每路AudioResampler</text><line x1="550.0" y1="135" x2="550.0" y2="1429" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="804.6666666666666" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="916.6666666666666" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">FFmpeg libswresample</text><line x1="916.6666666666666" y1="135" x2="916.6666666666666" y2="1429" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="183.33333333333334" y1="175" x2="550.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="175" x2="537.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="175" x2="537.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="366.6666666666667" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">convert(原始Float32 AudioPacket)</text><line x1="550.0" y1="232" x2="640.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="640.0" y1="232" x2="640.0" y2="250" stroke="#64748b" stroke-width="2" /><line x1="640.0" y1="250" x2="550.0" y2="250" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="250" x2="563.0" y2="243.0" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="250" x2="563.0" y2="257.0" stroke="#64748b" stroke-width="2" /><text x="558.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">校验采样率、声道掩码、时间和包布局</text><text x="14" y="280" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 输入无效或多声道布局不明</text><line x1="8" y1="261" x2="1092" y2="261" stroke="#64748b" stroke-width="2" /><line x1="550.0" y1="346" x2="183.33333333333334" y2="346" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="183.33333333333334" y1="346" x2="196.33333333333334" y2="339.0" stroke="#64748b" stroke-width="2" /><line x1="183.33333333333334" y1="346" x2="196.33333333333334" y2="353.0" stroke="#64748b" stroke-width="2" /><text x="366.6666666666667" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">异常，控制器禁用此路并显示错误</text><line x1="8" y1="375" x2="1092" y2="375" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="394" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 重复或倒序包</text><line x1="550.0" y1="460" x2="183.33333333333334" y2="460" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="183.33333333333334" y1="460" x2="196.33333333333334" y2="453.0" stroke="#64748b" stroke-width="2" /><line x1="183.33333333333334" y1="460" x2="196.33333333333334" y2="467.0" stroke="#64748b" stroke-width="2" /><text x="366.6666666666667" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">空包，不推进滤波状态</text><line x1="8" y1="489" x2="1092" y2="489" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="508" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 合法新包</text><text x="26" y="56