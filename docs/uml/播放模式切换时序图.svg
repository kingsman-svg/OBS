troke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MediaPlayer线程</text><line x1="1430.0" y1="135" x2="1430.0" y2="1486" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">直播切换为点播</text><line x1="390.0" y1="232" x2="480.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="232" x2="480.0" y2="250" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="250" x2="390.0" y2="250" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="250" x2="403.0" y2="243.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="250" x2="403.0" y2="257.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">显示本地文件与在线地址输入</text><text x="14" y="280" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 已在直播房间</text><line x1="8" y1="261" x2="1552" y2="261" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="346" x2="650.0" y2="346" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="346" x2="637.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="346" x2="637.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">leaveRoomRequested</text><line x1="650.0" y1="403" x2="910.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="403" x2="897.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="403" x2="897.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">request room.leave</text><line x1="910.0" y1="460" x2="1170.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="460" x2="1157.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="460" x2="1157.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">退出房间</text><line x1="1170.0" y1="517" x2="910.0" y2="517" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="517" x2="923.0" y2="510.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="517" x2="923.0" y2="524.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">成功或失败</text><line x1="910.0" y1="574" x2="650.0" y2="574" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="574" x2="663.0" y2="567.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="574" x2="663.0" y2="581.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">response</text><line x1="650.0" y1="631" x2="390.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="631" x2="403.0" y2="624.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="631" x2="403.0" y2="638.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">更新房间状态与按钮</text><line x1="8" y1="660" x2="1552" y2="660" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="679" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 尚未加入</text><line x1="390.0" y1="745" x2="480.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="745" x2="480.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="763" x2="390.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="763" x2="403.0" y2="756.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="763" x2="403.0" y2="770.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">直接切换页面</text><line x1="8" y1="261" x2="8" y2="780" stroke="#64748b" stroke-width="2" /><line x1="1552" y1="261" x2="1552" y2="780" stroke="#64748b" stroke-width="2" /><line x1="8" y1="780" x2="1552" y2="780" stroke="#64748b" stroke-width="2" /><rect x="589.5" y="832" width="381.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="780.0" y="854" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">请求进行中禁用模式切换；失败保留房间状态，可退出或重连</text><line x1="130.0" y1="916" x2="390.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="916" x2="377.0" y2="923.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="916" x2="377.0" y2="909.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">选择本地文件或填写在线地址</text><line x1="390.0" y1="973" x2="480.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="973" x2="480.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="991" x2="390.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="991" x2="403.0" y2="984.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="991" x2="403.0" y2="998.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">保存输入，登录且房间退出完成后允许播放</text><line x1="130.0" y1="1030" x2="390.0" y2="1030" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1030" x2="377.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1030" x2="377.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">点击播放</text><line x1="390.0" y1="1087" x2="650.0" y2="1087" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="1087" x2="637.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1087" x2="637.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">playbackRequested</text><line x1="650.0" y1="1144" x2="1430.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1144" x2="1417.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1144" x2="1417.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin，工作线程解封装/解码与播放</text><line x1="130.0" y1="1201" x2="390.0" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1201" x2="377.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1201" x2="377.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">切回直播</text><line x1="390.0" y1="1258" x2="650.0" y2="1258" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="1258" x2="637.0" y2="1265.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1258" x2="637.0" y2="1251.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stopPlaybackRequested</text><line x1="650.0" y1="1315" x2="1430.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1315" x2="1417.0" y2="1322.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1315" x2="1417.0" y2="1308.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，暂停画面交付、关闭声音</text><line x1="1430.0" y1="1372" x2="650.0" y2="1372" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="1372" x2="663.0" y2="1365.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1372" x2="663.0" y2="1379.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">回收资源后finished</text><rect x="94.5" y="1402" width="331.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="260.0" y="1424" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">本地/HTTP(S)点播共用流程；直播媒体拉流后续接入</text></svg>