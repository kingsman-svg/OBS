<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1977" viewBox="0 0 1560 1977"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">GPU预览渲染时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">PreviewWindow</text><line x1="130.0" y1="135" x2="130.0" y2="1942" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">VideoRenderer</text><line x1="390.0" y1="135" x2="390.0" y2="1942" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">D3D11设备</text><line x1="650.0" y1="135" x2="650.0" y2="1942" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">专用DeferredContext</text><line x1="910.0" y1="135" x2="910.0" y2="1942" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">共享ImmediateContext</text><line x1="1170.0" y1="135" x2="1170.0" y2="1942" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1318.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">DXGI交换链</text><line x1="1430.0" y1="135" x2="1430.0" y2="1942" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">setFrame(VideoFrame)，只缓存最新纹理</text><line x1="390.0" y1="232" x2="480.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="232" x2="480.0" y2="250" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="250" x2="390.0" y2="250" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="250" x2="403.0" y2="243.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="250" x2="403.0" y2="257.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">paintEvent，获取HWND物理像素尺寸</text><text x="14" y="280" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 首帧或输入设备/句柄变化</text><line x1="8" y1="261" x2="1552" y2="261" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="346" x2="480.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="346" x2="480.0" y2="364" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="364" x2="390.0" y2="364" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="364" x2="403.0" y2="357.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="364" x2="403.0" y2="371.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">释放旧视图和交换链，Flush</text><line x1="390.0" y1="403" x2="650.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="403" x2="637.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="403" x2="637.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">沿输入纹理GetDevice，创建DeferredContext</text><line x1="390.0" y1="460" x2="650.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="460" x2="637.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="460" x2="637.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">编译VS/PS，创建固定二维状态</text><line x1="390.0" y1="517" x2="1430.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="517" x2="1417.0" y2="524.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="517" x2="1417.0" y2="510.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">CreateSwapChainForHwnd，双缓冲flip</text><line x1="8" y1="261" x2="8" y2="552" stroke="#64748b" stroke-width="2" /><line x1="1552" y1="261" x2="1552" y2="552" stroke="#64748b" stroke-width="2" /><line x1="8" y1="552" x2="1552" y2="552" stroke="#64748b" stroke-width="2" /><text x="14" y="622" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 窗口物理尺寸变化</text><line x1="8" y1="603" x2="1552" y2="603" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="688" x2="480.0" y2="688" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="688" x2="480.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="706" x2="390.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="706" x2="403.0" y2="699.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="706" x2="403.0" y2="713.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">释放RTV，清除旧后缓冲引用</text><line x1="390.0" y1="745" x2="1430.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="745" x2="1417.0" y2="752.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="745" x2="1417.0" y2="738.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">ResizeBuffers / GetBuffer</text><line x1="390.0" y1="802" x2="650.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="802" x2="637.0" y2="809.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="802" x2="637.0" y2="795.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">创建新的RTV</text><line x1="8" y1="603" x2="8" y2="837" stroke="#64748b" stroke-width="2" /><line x1="1552" y1="603" x2="1552" y2="837" stroke="#64748b" stroke-width="2" /><line x1="8" y1="837" x2="1552" y2="837" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="916" x2="650.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="916" x2="637.0" y2="923.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="916" x2="637.0" y2="909.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">输入BGRA纹理创建SRV</text><line x1="390.0" y1="973" x2="910.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="973" x2="897.0" y2="980.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="973" x2="897.0" y2="966.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">清背景，绑定SRV/Shader/等比视口，Draw(3)</text><line x1="390.0" y1="1030" x2="910.0" y2="1030" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1030" x2="897.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1030" x2="897.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">FinishCommandList(FALSE)，重置录制状态</text><line x1="910.0" y1="1087" x2="390.0" y2="1087" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1087" x2="403.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1087" x2="403.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">CommandList</text><line x1="390.0" y1="1144" x2="1170.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1144" x2="1157.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1144" x2="1157.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">ExecuteCommandList(TRUE)，恢复共享状态</text><line x1="390.0" y1="1201" x2="1430.0" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1201" x2="1417.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1201" x2="1417.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">Present(0, DO_NOT_WAIT)</text><text x="14" y="1249" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] Present队列忙碌</text><line x1="8" y1="1230" x2="1552" y2="1230" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1315" x2="390.0" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1315" x2="403.0" y2="1308.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1315" x2="403.0" y2="1322.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">WAS_STILL_DRAWING</text><line x1="390.0" y1="1372" x2="480.0" y2="1372" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1372" x2="480.0" y2="1390" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1390" x2="390.0" y2="1390" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1390" x2="403.0" y2="1383.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1390" x2="403.0" y2="1397.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">最多一个16ms延迟重试，避免静态首帧丢失</text><line x1="8" y1="1401" x2="1552" y2="1401" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1420" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 窗口遮挡</text><line x1="1430.0" y1="1486" x2="390.0" y2="1486" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1486" x2="403.0" y2="1479.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1486" x2="403.0" y2="1493.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1475" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">OCCLUDED，等待后续窗口/帧事件</text><line x1="8" y1="1515" x2="1552" y2="1515" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1534" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] Present成功</text><line x1="390.0" y1="1600" x2="480.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1600" x2="480.0" y2="1618" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1618" x2="390.0" y2="1618" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1618" x2="403.0" y2="1611.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1618" x2="403.0" y2="1625.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">emit framePresented(sequence)，供调试观察</text><line x1="8" y1="1629" x2="1552" y2="1629" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1648" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 格式/设备/交换链失败</text><line x1="390.0" y1="1714" x2="480.0" y2="1714" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1714" x2="480.0" y2="1732" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1732" x2="390.0" y2="1732" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1732" x2="403.0" y2="1725.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1732" x2="403.0" y2="1739.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="1703" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">释放渲染资源并锁存错误</text><line x1="390.0" y1="1771" x2="130.0" y2="1771" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="1771" x2="143.0" y2="1764.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1771" x2="143.0" y2="1778.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1760" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">failed，显示错误，采集仍继续</text><line x1="8" y1="1230" x2="8" y2="1806" stroke="#64748b" stroke-width="2" /><line x1="1552" y1="1230" x2="1552" y2="1806" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1806" x2="1552" y2="1806" stroke="#64748b" stroke-width="2" /><rect x="712.5" y="1858" width="395.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="910.0" y="1880" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">复用同设备，立即上下文开启线程保护；生产路径没有CPU读回</text></svg>