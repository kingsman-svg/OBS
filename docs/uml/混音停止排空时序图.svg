<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1407" viewBox="0 0 1300 1407"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">混音停止排空时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">用户</text><line x1="130.0" y1="135" x2="130.0" y2="1372" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SessionController</text><line x1="390.0" y1="135" x2="390.0" y2="1372" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">两路WasapiCapture</text><line x1="650.0" y1="135" x2="650.0" y2="1372" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">AudioMixer</text><line x1="910.0" y1="135" x2="910.0" y2="1372" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">每路AudioResampler</text><line x1="1170.0" y1="135" x2="1170.0" y2="1372" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止采集或退出登录</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop / requestInterruption</text><text x="14" y="280" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 普通停止且仍登录</text><line x1="8" y1="261" x2="1292" y2="261" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="346" x2="480.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="346" x2="480.0" y2="364" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="364" x2="390.0" y2="364" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="364" x2="403.0" y2="357.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="364" x2="403.0" y2="371.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">暂停普通输出，继续取走最后的采集包</text><line x1="650.0" y1="403" x2="740.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="403" x2="740.0" y2="421" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="421" x2="650.0" y2="421" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="421" x2="663.0" y2="414.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="421" x2="663.0" y2="428.0" stroke="#64748b" stroke-width="2" /><text x="658.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">ReleaseBuffer / Stop / 释放COM</text><line x1="650.0" y1="460" x2="390.0" y2="460" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="460" x2="403.0" y2="453.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="460" x2="403.0" y2="467.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished</text><line x1="390.0" y1="517" x2="910.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="517" x2="897.0" y2="524.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="517" x2="897.0" y2="510.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">push最后一批数据</text><line x1="390.0" y1="574" x2="480.0" y2="574" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="574" x2="480.0" y2="592" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="592" x2="390.0" y2="592" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="592" x2="403.0" y2="585.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="592" x2="403.0" y2="599.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">两路音频均finished</text><line x1="390.0" y1="631" x2="910.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="631" x2="897.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="631" x2="897.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finish</text><line x1="910.0" y1="688" x2="1170.0" y2="688" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="688" x2="1157.0" y2="695.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="688" x2="1157.0" y2="681.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">drain</text><line x1="1170.0" y1="745" x2="1260.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="745" x2="1260.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="763" x2="1170.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="763" x2="1183.0" y2="756.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="763" x2="1183.0" y2="770.0" stroke="#64748b" stroke-width="2" /><text x="884.015625" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">swr_convert(nullptr,0)，取滤波尾部并reset</text><line x1="1170.0" y1="802" x2="910.0" y2="802" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="802" x2="923.0" y2="795.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="802" x2="923.0" y2="809.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">尾部重采样数据</text><line x1="910.0" y1="859" x2="1000.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="859" x2="1000.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="877" x2="910.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="877" x2="923.0" y2="870.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="877" x2="923.0" y2="884.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">最多排空500ms，最后不足10ms补零</text><line x1="910.0" y1="916" x2="390.0" y2="916" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="916" x2="403.0" y2="909.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="916" x2="403.0" y2="923.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">固定10ms尾部包</text><line x1="390.0" y1="973" x2="480.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="973" x2="480.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="991" x2="390.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="991" x2="403.0" y2="984.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="991" x2="403.0" y2="998.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">emit mixedAudioReady后标记已停止</text><line x1="8" y1="1002" x2="1292" y2="1002" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1021" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 退出登录或登录失效</text><line x1="390.0" y1="1087" x2="910.0" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1087" x2="897.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1087" x2="897.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">clear，立即丢弃缓存/滤波尾部</text><line x1="650.0" y1="1144" x2="390.0" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1144" x2="403.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1144" x2="403.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished及迟到包</text><line x1="390.0" y1="1201" x2="480.0" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1201" x2="480.0" y2="1219" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1219" x2="390.0" y2="1219" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1219" x2="403.0" y2="1212.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1219" x2="403.0" y2="1226.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">丢弃，不再发出混音输出</text><line x1="8" y1="261" x2="8" y2="1236" stroke="#64748b" stroke-width="2" /><line x1="1292" y1="261" x2="1292" y2="1236" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1236" x2="1292" y2="1236" stroke="#64748b" stroke-width="2" /><rect x="564.5" y="1288" width="431.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="780.0" y="1310" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">日常停止不wait；关闭程序时析构wait并释放滤波器，不保证尾部交付</text></svg>