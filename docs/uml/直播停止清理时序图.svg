<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1635" viewBox="0 0 1820 1635"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">直播停止清理时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">主播或观众</text><line x1="130.0" y1="135" x2="130.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SessionController GUI</text><line x1="390.0" y1="135" x2="390.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">RTMP输出线程</text><line x1="650.0" y1="135" x2="650.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SRS独立容器</text><line x1="910.0" y1="135" x2="910.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SignalServer</text><line x1="1170.0" y1="135" x2="1170.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1318.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">观众Controller</text><line x1="1430.0" y1="135" x2="1430.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1578.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1690.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MediaPlayer与WASAPI</text><line x1="1690.0" y1="135" x2="1690.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">主播停止直播</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，撤销入口并设置IO取消</text><line x1="390.0" y1="289" x2="480.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="289" x2="480.0" y2="307" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="307" x2="390.0" y2="307" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="307" x2="403.0" y2="300.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="307" x2="403.0" y2="314.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">停止采集，MP4录制继续排空封存</text><text x="14" y="337" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] live.start请求在途</text><line x1="8" y1="318" x2="1812" y2="318" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="403" x2="480.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="403" x2="480.0" y2="421" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="421" x2="390.0" y2="421" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="421" x2="403.0" y2="414.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="421" x2="403.0" y2="428.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">保留停止意图</text><line x1="1170.0" y1="460" x2="390.0" y2="460" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="460" x2="403.0" y2="453.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="460" x2="403.0" y2="467.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">开播响应到达</text><line x1="390.0" y1="517" x2="1170.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="517" x2="1157.0" y2="524.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="517" x2="1157.0" y2="510.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">补发live.stop</text><line x1="8" y1="546" x2="1812" y2="546" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="565" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 信令空闲</text><line x1="390.0" y1="631" x2="1170.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="631" x2="1157.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="631" x2="1157.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">live.stop</text><line x1="8" y1="318" x2="8" y2="666" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="318" x2="1812" y2="666" stroke="#64748b" stroke-width="2" /><line x1="8" y1="666" x2="1812" y2="666" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="745" x2="910.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="745" x2="897.0" y2="752.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="745" x2="897.0" y2="738.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">关闭RTMP连接并释放编码器</text><line x1="650.0" y1="802" x2="390.0" y2="802" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="802" x2="403.0" y2="795.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="802" x2="403.0" y2="809.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">completed、finished</text><line x1="1170.0" y1="859" x2="1430.0" y2="859" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1430.0" y1="859" x2="1417.0" y2="866.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="859" x2="1417.0" y2="852.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">live.changed=false</text><line x1="1430.0" y1="916" x2="1690.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="916" x2="1677.0" y2="923.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="916" x2="1677.0" y2="909.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，停GUI交付、中断读取、关闭声音</text><line x1="1690.0" y1="973" x2="1780.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="973" x2="1780.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="991" x2="1690.0" y2="991" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="991" x2="1703.0" y2="984.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="991" x2="1703.0" y2="998.0" stroke="#64748b" stroke-width="2" /><text x="1434.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">解码资源析构，等待输出线程归还COM</text><line x1="1690.0" y1="1030" x2="1430.0" y2="1030" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1430.0" y1="1030" x2="1443.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1030" x2="1443.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">finished</text><line x1="1430.0" y1="1087" x2="130.0" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1087" x2="143.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1087" x2="143.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">留在房间等待下一次开播</text><text x="14" y="1135" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 主播关闭房间或断开信令</text><line x1="8" y1="1116" x2="1812" y2="1116" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1201" x2="1430.0" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1430.0" y1="1201" x2="1417.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1201" x2="1417.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">room.closed</text><line x1="1430.0" y1="1258" x2="1690.0" y2="1258" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1258" x2="1677.0" y2="1265.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1258" x2="1677.0" y2="1251.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止媒体并清房间</text><line x1="8" y1="1287" x2="1812" y2="1287" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1306" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 观众手动停止或切换点播</text><line x1="130.0" y1="1372" x2="1430.0" y2="1372" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1372" x2="1417.0" y2="1379.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1372" x2="1417.0" y2="1365.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止播放或切换模式</text><line x1="1430.0" y1="1429" x2="1690.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1429" x2="1677.0" y2="1436.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1429" x2="1677.0" y2="1422.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，停止自动播放意图</text><line x1="8" y1="1116" x2="8" y2="1464" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="1116" x2="1812" y2="1464" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1464" x2="1812" y2="1464" stroke="#64748b" stroke-width="2" /><rect x="872.5" y="1516" width="335.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1040.0" y="1538" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">GUI收到finished才解除重启锁，日常启停不调用wait</text></svg>