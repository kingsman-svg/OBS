<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1179" viewBox="0 0 1100 1179"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">定时器调度时序图</text><rect x="25.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="137.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">调用线程</text><line x1="137.5" y1="135" x2="137.5" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="300.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="412.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">EventLoop</text><line x1="412.5" y1="135" x2="412.5" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="575.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="687.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">TimerQueue</text><line x1="687.5" y1="135" x2="687.5" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="850.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="962.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">timerfd与epoll</text><line x1="962.5" y1="135" x2="962.5" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="137.5" y1="175" x2="412.5" y2="175" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="275.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">runAfter 或 runEvery</text><line x1="412.5" y1="232" x2="687.5" y2="232" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="232" x2="674.5" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="232" x2="674.5" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">分配取消标记和到期时间</text><text x="14" y="280" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 其他线程调用</text><line x1="8" y1="261" x2="1092" y2="261" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="346" x2="412.5" y2="346" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="346" x2="425.5" y2="339.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="346" x2="425.5" y2="353.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">排队插入并唤醒 eventfd</text><line x1="8" y1="375" x2="1092" y2="375" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="394" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 归属线程调用</text><line x1="687.5" y1="460" x2="777.5" y2="460" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="460" x2="777.5" y2="478" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="478" x2="687.5" y2="478" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="478" x2="700.5" y2="471.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="478" x2="700.5" y2="485.0" stroke="#64748b" stroke-width="2" /><text x="695.5" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">直接插入到期队列</text><line x1="8" y1="261" x2="8" y2="495" stroke="#64748b" stroke-width="2" /><line x1="1092" y1="261" x2="1092" y2="495" stroke="#64748b" stroke-width="2" /><line x1="8" y1="495" x2="1092" y2="495" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="574" x2="962.5" y2="574" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="574" x2="949.5" y2="581.0" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="574" x2="949.5" y2="567.0" stroke="#64748b" stroke-width="2" /><text x="825.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">设置最早期限</text><line x1="962.5" y1="631" x2="412.5" y2="631" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="412.5" y1="631" x2="425.5" y2="624.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="631" x2="425.5" y2="638.0" stroke="#64748b" stroke-width="2" /><text x="687.5" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">定时器可读</text><line x1="412.5" y1="688" x2="687.5" y2="688" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="688" x2="674.5" y2="695.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="688" x2="674.5" y2="681.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">摘出本批到期任务</text><line x1="687.5" y1="745" x2="137.5" y2="745" stroke="#64748b" stroke-width="2" /><line x1="137.5" y1="745" x2="150.5" y2="738.0" stroke="#64748b" stroke-width="2" /><line x1="137.5" y1="745" x2="150.5" y2="752.0" stroke="#64748b" stroke-width="2" /><text x="412.5" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">在 loop 线程执行回调</text><text x="14" y="793" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 重复且未取消</text><line x1="8" y1="774" x2="1092" y2="774" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="859" x2="777.5" y2="859" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="859" x2="777.5" y2="877" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="877" x2="687.5" y2="877" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="877" x2="700.5" y2="870.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="877" x2="700.5" y2="884.0" stroke="#64748b" stroke-width="2" /><text x="695.5" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">从回调完成时重新计时</text><line x1="8" y1="888" x2="1092" y2="888" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="907" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 一次性或已取消</text><line x1="687.5" y1="973" x2="777.5" y2="973" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="973" x2="777.5" y2="991" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="991" x2="687.5" y2="991" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="991" x2="700.5" y2="984.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="991" x2="700.5" y2="998.0" stroke="#64748b" stroke-width="2" /><text x="695.5" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">标记完成并释放任务</text><line x1="8" y1="774" x2="8" y2="1008" stroke="#64748b" stroke-width="2" /><line x1="1092" y1="774" x2="1092" y2="1008" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1008" x2="1092" y2="1008" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="1087" x2="962.5" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="1087" x2="949.5" y2="1094.0" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="1087" x2="949.5" y2="1080.0" stroke="#64748b" stroke-width="2" /><text x="825.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">设置下一期限或撤防</text></svg>