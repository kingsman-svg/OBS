ke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MediaEncoder/NVENC</text><line x1="1430.0" y1="135" x2="1430.0" y2="2341" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1578.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1690.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">RTMP IO</text><line x1="1690.0" y1="135" x2="1690.0" y2="2341" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">设置手动/自动及码率范围，开播</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">startLive意图</text><line x1="650.0" y1="289" x2="910.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="289" x2="897.0" y2="296.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="289" x2="897.0" y2="282.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin(settings)，清状态并start</text><line x1="910.0" y1="346" x2="1170.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="346" x2="1157.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="346" x2="1157.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">QThread调用run，创建独占编码/网络资源</text><line x1="650.0" y1="403" x2="910.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="403" x2="897.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="403" x2="897.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">push同步原始帧/PCM，记录入队时间与峰值</text><line x1="910.0" y1="460" x2="1000.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="460" x2="1000.0" y2="478" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="478" x2="910.0" y2="478" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="478" x2="923.0" y2="471.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="478" x2="923.0" y2="485.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">直播高低水位裁剪过期原始媒体，音频推进共同截止点</text><line x1="130.0" y1="517" x2="390.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="517" x2="377.0" y2="524.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="517" x2="377.0" y2="510.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">修改模式/范围并点击应用设置</text><line x1="390.0" y1="574" x2="650.0" y2="574" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="574" x2="637.0" y2="581.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="574" x2="637.0" y2="567.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">liveBitrateControlRequested(模式/下限/上限)</text><line x1="650.0" y1="631" x2="910.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="631" x2="897.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="631" x2="897.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">requestBitrateControl，只存最新整份配置</text><text x="14" y="679" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 停止/纯音频/未运行/非法范围/MP4自动</text><line x1="8" y1="660" x2="1812" y2="660" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="745" x2="650.0" y2="745" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="745" x2="663.0" y2="738.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="745" x2="663.0" y2="752.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">false，不修改当前目标</text><line x1="8" y1="774" x2="1812" y2="774" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="793" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 接受请求</text><line x1="910.0" y1="859" x2="650.0" y2="859" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="859" x2="663.0" y2="852.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="859" x2="663.0" y2="866.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">true，统计显示新设置待接收</text><line x1="1170.0" y1="916" x2="910.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="916" x2="923.0" y2="909.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="916" x2="923.0" y2="923.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">出队前再检查年龄，整批过期则等新输入</text><line x1="1170.0" y1="973" x2="910.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="973" x2="923.0" y2="966.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="973" x2="923.0" y2="980.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">接收配置；自动保留当前目标并裁到新范围</text><line x1="1170.0" y1="1030" x2="1260.0" y2="1030" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1030" x2="1260.0" y2="1048" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1048" x2="1170.0" y2="1048" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1048" x2="1183.0" y2="1041.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1048" x2="1183.0" y2="1055.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">自动每500ms评估发送压力，较快下降/稳定慢升</text><line x1="1170.0" y1="1087" x2="910.0" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1087" x2="923.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1087" x2="923.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">下一张视频出队，比较计划目标与提交目标</text><line x1="1170.0" y1="1144" x2="1430.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1144" x2="1417.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1144" x2="1417.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">setVideoBitrate，修改公开码率字段</text><line x1="1170.0" y1="1201" x2="1430.0" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1201" x2="1417.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1201" x2="1417.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">pushVideo，保留原PTS</text><line x1="1430.0" y1="1258" x2="1520.0" y2="1258" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="1258" x2="1520.0" y2="1276" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="1276" x2="1430.0" y2="1276" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1276" x2="1443.0" y2="1269.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1276" x2="1443.0" y2="1283.0" stroke="#64748b" stroke-width="2" /><text x="1438.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">send_frame内NVENC重配置/IDR</text><line x1="1430.0" y1="1315" x2="1690.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1315" x2="1677.0" y2="1322.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1315" x2="1677.0" y2="1308.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">同步sink交织写出并flush，IO期间不持队列锁</text><line x1="650.0" y1="1372" x2="910.0" y2="1372" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1372" x2="897.0" y2="1379.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1372" x2="897.0" y2="1365.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stats，观察队头年龄/跨度、当前写出等待</text><line x1="910.0" y1="1429" x2="650.0" y2="1429" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="1429" x2="663.0" y2="1422.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1429" x2="663.0" y2="1436.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">短锁统计副本，GUI保持响应</text><line x1="1690.0" y1="1486" x2="1430.0" y2="1486" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1430.0" y1="1486" x2="1443.0" y2="1479.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1486" x2="1443.0" y2="1493.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1475" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">返回或抛出IO错误，记录耗时/字节</text><line x1="1430.0" y1="1543" x2="1170.0" y2="1543" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="1543" x2="1183.0" y2="1536.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1543" x2="1183.0" y2="1550.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1532" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">视频压缩包统计与提交目标</text><line x1="1170.0" y1="1600" x2="910.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1600" x2="923.0" y2="1593.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1600" x2="923.0" y2="1607.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">合并统计，保留并发新请求与入口丢弃</text><line x1="650.0" y1="1657" x2="390.0" y2="1657" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1657" x2="403.0" y2="1650.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1657" x2="403.0" y2="1664.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1646" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">诊断最多5Hz刷新，参数/状态事件立即更新</text><line x1="8" y1="660" x2="8" y2="1692" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="660" x2="1812" y2="1692" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1692" x2="1812" y2="1692" stroke="#64748b" stroke-width="2" /><text x="14" y="1762" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 用户停止</text><line x1="8" y1="1743" x2="1812" y2="1743" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1828" x2="910.0" y2="1828" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1828" x2="897.0" y2="1835.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1828" x2="897.0" y2="1821.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1817" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，关入口并清未消费请求</text><line x1="910.0" y1="1885" x2="1690.0" y2="1885" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1885" x2="1677.0" y2="1892.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1885" x2="1677.0" y2="1878.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1874" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">取消网络等待</text><line x1="1170.0" y1="1942" x2="1260.0" y2="1942" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1942" x2="1260.0" y2="1960" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1960" x2="1170.0" y2="1960" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1960" x2="1183.0" y2="1953.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1960" x2="1183.0" y2="1967.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1931" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">清理资源，丢队列</text><line x1="1170.0" y1="1999" x2="650.0" y2="1999" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="1999" x2="663.0" y2="1992.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1999" x2="663.0" y2="2006.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1988" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">completed/finished，才允许重启</text><line x1="8" y1="2028" x2="1812" y2="2028" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="2047" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 编码/IO失败</text><line x1="1170.0" y1="2113" x2="1260.0" y2="2113" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="2113" x2="1260.0" y2="2131" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="2131" x2="1170.0" y2="2131" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="2131" x2="1183.0" y2="2124.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="2131" x2="1183.0" y2="2138.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="2102" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">释放本轮资源</text><line x1="1170.0" y1="2170" x2="650.0" y2="2170" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="2170" x2="663.0" y2="2163.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="2170" x2="663.0" y2="2177.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="2159" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">failed/finished，保留错误</text><line x1="8" y1="1743" x2="8" y2="2205" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="1743" x2="1812" y2="2205" stroke="#64748b" stroke-width="2" /><line x1="8" y1="2205" x2="1812" y2="2205" stroke="#64748b" stroke-width="2" /><rect x="1372.0" y="2257" width="376.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1560.0" y="2279" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">编码目标不是驱动确认，实际包码率/IO吞吐也不是可用带宽</text></svg>