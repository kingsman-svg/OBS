<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1635" viewBox="0 0 1560 1635"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">网关音频转码时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">RTMP读取线程</text><line x1="130.0" y1="135" x2="130.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">AAC解码器</text><line x1="390.0" y1="135" x2="390.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SWR与FIFO</text><line x1="650.0" y1="135" x2="650.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Opus编码器</text><line x1="910.0" y1="135" x2="910.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">音视频交接队列</text><line x1="1170.0" y1="135" x2="1170.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1318.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">网关EventLoop</text><line x1="1430.0" y1="135" x2="1430.0" y2="1600" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="220.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="220.0" y1="175" x2="220.0" y2="193" stroke="#64748b" stroke-width="2" /><line x1="220.0" y1="193" x2="130.0" y2="193" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="193" x2="143.0" y2="186.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="193" x2="143.0" y2="200.0" stroke="#64748b" stroke-width="2" /><text x="138.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">探测AAC并创建普通AudioTranscoder</text><line x1="130.0" y1="232" x2="390.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="232" x2="377.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="232" x2="377.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">push带源PTS的AVPacket</text><line x1="390.0" y1="289" x2="130.0" y2="289" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="289" x2="143.0" y2="282.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="289" x2="143.0" y2="296.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">实际格式和时间戳的解码AVFrame</text><text x="14" y="337" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 首帧或格式与时间段变化</text><line x1="8" y1="318" x2="1552" y2="318" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="403" x2="650.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="403" x2="637.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="403" x2="637.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="390.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">建立48kHz立体声Float32转换</text><line x1="130.0" y1="460" x2="910.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="460" x2="897.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="460" x2="897.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">建立20ms低延迟Opus编码</text><rect x="640.0" y="490" width="280.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="780.0" y="512" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">重建时丢旧FIFO和编码历史，并标记不连续</text><line x1="8" y1="318" x2="8" y2="552" stroke="#64748b" stroke-width="2" /><line x1="1552" y1="318" x2="1552" y2="552" stroke="#64748b" stroke-width="2" /><line x1="8" y1="552" x2="1552" y2="552" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="631" x2="650.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="631" x2="637.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="631" x2="637.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="390.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">按源样本时间重采样并入FIFO</text><line x1="650.0" y1="688" x2="130.0" y2="688" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="688" x2="143.0" y2="681.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="688" x2="143.0" y2="695.0" stroke="#64748b" stroke-width="2" /><text x="390.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">每960采样帧可编码</text><line x1="130.0" y1="745" x2="910.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="745" x2="897.0" y2="752.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="745" x2="897.0" y2="738.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">send_frame保留绝对样本PTS</text><line x1="910.0" y1="802" x2="130.0" y2="802" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="802" x2="143.0" y2="795.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="802" x2="143.0" y2="809.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">packet PTS已包含lookahead修正</text><line x1="130.0" y1="859" x2="1170.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="859" x2="1157.0" y2="866.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="859" x2="1157.0" y2="852.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">压缩Opus加PTS和epoch组成MediaUnit</text><rect x="485.5" y="889" width="329.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="650.0" y="911" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">不把转码完成时刻当采集时间，不二次添加编码延迟</text><line x1="1430.0" y1="973" x2="1170.0" y2="973" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="973" x2="1183.0" y2="966.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="973" x2="1183.0" y2="980.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">tick取出并按媒体PTS排序</text><line x1="1170.0" y1="1030" x2="1430.0" y2="1030" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1430.0" y1="1030" x2="1417.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1030" x2="1417.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">音视频共用32单元与300ms预算</text><text x="14" y="1078" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 正常EOF</text><line x1="8" y1="1059" x2="1552" y2="1059" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1144" x2="390.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1144" x2="377.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1144" x2="377.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">排空解码帧</text><line x1="130.0" y1="1201" x2="650.0" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1201" x2="637.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1201" x2="637.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="390.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">排SWR滤波尾部与FIFO</text><line x1="130.0" y1="1258" x2="910.0" y2="1258" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1258" x2="897.0" y2="1265.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1258" x2="897.0" y2="1251.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">编码有效尾部并finish一次</text><line x1="130.0" y1="1315" x2="1170.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1315" x2="1157.0" y2="1322.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1315" x2="1157.0" y2="1308.0" stroke="#64748b" stroke-width="2" /><text x="650.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">交付剩余有效包</text><line x1="8" y1="1344" x2="1552" y2="1344" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1363" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] stop或换流或IO超时</text><line x1="130.0" y1="1429" x2="220.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="220.0" y1="1429" x2="220.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="220.0" y1="1447" x2="130.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1447" x2="143.0" y2="1440.0" stroke="#64748b" stroke-width="2" /><line x1="130.0" y1="1447" x2="143.0" y2="1454.0" stroke="#64748b" stroke-width="2" /><text x="138.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">读取线程直接销毁旧段资源</text><rect x="415.0" y="1459" width="210.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="520.0" y="1481" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">不把旧尾包回放到新流</text><line x1="8" y1="1059" x2="8" y2="1521" stroke="#64748b" stroke-width="2" /><line x1="1552" y1="1059" x2="1552" y2="1521" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1521" x2="1552" y2="1521" stroke="#64748b" stroke-width="2" /></svg>