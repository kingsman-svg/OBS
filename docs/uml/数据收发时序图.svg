<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1464" viewBox="0 0 1100 1464"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">数据收发时序图</text><rect x="25.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="137.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">TCP 对端</text><line x1="137.5" y1="135" x2="137.5" y2="1429" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="300.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="412.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">EventLoop / Channel</text><line x1="412.5" y1="135" x2="412.5" y2="1429" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="575.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="687.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">TcpConnection</text><line x1="687.5" y1="135" x2="687.5" y2="1429" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="850.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="962.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">业务解析器</text><line x1="962.5" y1="135" x2="962.5" y2="1429" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="137.5" y1="175" x2="412.5" y2="175" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="275.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">TCP 数据可读</text><line x1="412.5" y1="232" x2="687.5" y2="232" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="232" x2="674.5" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="232" x2="674.5" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">handleRead()，recv 非阻塞读取</text><line x1="687.5" y1="289" x2="777.5" y2="289" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="289" x2="777.5" y2="307" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="307" x2="687.5" y2="307" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="307" x2="700.5" y2="300.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="307" x2="700.5" y2="314.0" stroke="#64748b" stroke-width="2" /><text x="695.5" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">input Buffer 累积字节</text><text x="14" y="337" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 输入超过 8 MiB 或 recv 错误</text><line x1="8" y1="318" x2="1092" y2="318" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="403" x2="777.5" y2="403" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="403" x2="777.5" y2="421" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="421" x2="687.5" y2="421" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="421" x2="700.5" y2="414.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="421" x2="700.5" y2="428.0" stroke="#64748b" stroke-width="2" /><text x="695.5" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">handleClose() 移除订阅并关闭 fd</text><line x1="8" y1="432" x2="1092" y2="432" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="451" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 已收到合法数量的字节</text><line x1="687.5" y1="517" x2="962.5" y2="517" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="517" x2="949.5" y2="524.0" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="517" x2="949.5" y2="510.0" stroke="#64748b" stroke-width="2" /><text x="825.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">messageCallback(conn, input)</text><line x1="962.5" y1="574" x2="1052.5" y2="574" stroke="#64748b" stroke-width="2" /><line x1="1052.5" y1="574" x2="1052.5" y2="592" stroke="#64748b" stroke-width="2" /><line x1="1052.5" y1="592" x2="962.5" y2="592" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="592" x2="975.5" y2="585.0" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="592" x2="975.5" y2="599.0" stroke="#64748b" stroke-width="2" /><text x="698.5" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">不完整保留；完整消息消费，可连续解析</text><line x1="962.5" y1="631" x2="687.5" y2="631" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="631" x2="700.5" y2="624.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="631" x2="700.5" y2="638.0" stroke="#64748b" stroke-width="2" /><text x="825.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">send(response)，复制数据</text><line x1="8" y1="318" x2="8" y2="666" stroke="#64748b" stroke-width="2" /><line x1="1092" y1="318" x2="1092" y2="666" stroke="#64748b" stroke-width="2" /><line x1="8" y1="666" x2="1092" y2="666" stroke="#64748b" stroke-width="2" /><rect x="530.5" y="718" width="314.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="687.5" y="740" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">下方为 send 的处理分支；已断开的连接忽略发送</text><text x="14" y="793" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 直接写完成</text><line x1="8" y1="774" x2="1092" y2="774" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="859" x2="137.5" y2="859" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="137.5" y1="859" x2="150.5" y2="852.0" stroke="#64748b" stroke-width="2" /><line x1="137.5" y1="859" x2="150.5" y2="866.0" stroke="#64748b" stroke-width="2" /><text x="412.5" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">send(MSG_NOSIGNAL)</text><line x1="8" y1="888" x2="1092" y2="888" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="907" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 部分写或 EAGAIN</text><line x1="687.5" y1="973" x2="777.5" y2="973" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="973" x2="777.5" y2="991" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="991" x2="687.5" y2="991" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="991" x2="700.5" y2="984.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="991" x2="700.5" y2="998.0" stroke="#64748b" stroke-width="2" /><text x="695.5" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">剩余字节存入 output Buffer</text><line x1="687.5" y1="1030" x2="412.5" y2="1030" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="1030" x2="425.5" y2="1023.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="1030" x2="425.5" y2="1037.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">订阅 EPOLLOUT</text><line x1="412.5" y1="1087" x2="687.5" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="1087" x2="674.5" y2="1094.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="1087" x2="674.5" y2="1080.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">handleWrite()，分轮排空</text><line x1="687.5" y1="1144" x2="137.5" y2="1144" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="137.5" y1="1144" x2="150.5" y2="1137.0" stroke="#64748b" stroke-width="2" /><line x1="137.5" y1="1144" x2="150.5" y2="1151.0" stroke="#64748b" stroke-width="2" /><text x="412.5" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">剩余响应</text><line x1="687.5" y1="1201" x2="412.5" y2="1201" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="1201" x2="425.5" y2="1194.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="1201" x2="425.5" y2="1208.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">缓冲排空，取消 EPOLLOUT</text><line x1="8" y1="1230" x2="1092" y2="1230" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1249" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 输出超限或发送错误</text><line x1="687.5" y1="1315" x2="777.5" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="1315" x2="777.5" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="777.5" y1="1333" x2="687.5" y2="1333" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="1333" x2="700.5" y2="1326.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="1333" x2="700.5" y2="1340.0" stroke="#64748b" stroke-width="2" /><text x="695.5" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">handleClose()，通知 Server 移除连接</text><line x1="8" y1="774" x2="8" y2="1350" stroke="#64748b" stroke-width="2" /><line x1="1092" y1="774" x2="1092" y2="1350" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1350" x2="1092" y2="1350" stroke="#64748b" stroke-width="2" /></svg>