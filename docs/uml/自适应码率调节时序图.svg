<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="2262" viewBox="0 0 1820 2262"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">自适应码率调节时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">主播</text><line x1="130.0" y1="135" x2="130.0" y2="2227" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MainWindow</text><line x1="390.0" y1="135" x2="390.0" y2="2227" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Controller/GUI</text><line x1="650.0" y1="135" x2="650.0" y2="2227" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Publisher邮箱/队列</text><line x1="910.0" y1="135" x2="910.0" y2="2227" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">线程内ABR策略</text><line x1="1170.0" y1="135" x2="1170.0" y2="2227" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1318.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MediaEncoder/NVENC</text><line x1="1430.0" y1="135" x2="1430.0" y2="2227" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1578.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1690.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">RTMP媒体IO</text><line x1="1690.0" y1="135" x2="1690.0" y2="2227" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">选择手动/自动、下限/上限并开播</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">开播意图</text><line x1="650.0" y1="289" x2="910.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="289" x2="897.0" y2="296.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="289" x2="897.0" y2="282.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin验证设置，清状态并start</text><line x1="910.0" y1="346" x2="1430.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="346" x2="1417.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="346" x2="1417.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">run内初始化编码及RTMP，复用原GPU设备/PTS</text><line x1="910.0" y1="403" x2="1170.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="403" x2="1157.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="403" x2="1157.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">创建策略，建立累计反馈基线</text><line x1="130.0" y1="460" x2="390.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="460" x2="377.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="460" x2="377.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">修改范围/模式，点击应用设置</text><line x1="390.0" y1="517" x2="650.0" y2="517" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="517" x2="637.0" y2="524.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="517" x2="637.0" y2="510.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">一次提交完整配置</text><line x1="650.0" y1="574" x2="910.0" y2="574" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="574" x2="897.0" y2="581.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="574" x2="897.0" y2="567.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">requestBitrateControl，只保存最新请求</text><text x="14" y="622" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 非法范围/停止/纯音频/MP4自动</text><line x1="8" y1="603" x2="1812" y2="603" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="688" x2="650.0" y2="688" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="688" x2="663.0" y2="681.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="688" x2="663.0" y2="695.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">false，原设置不变</text><line x1="8" y1="717" x2="1812" y2="717" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="736" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 接受请求</text><line x1="910.0" y1="802" x2="650.0" y2="802" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="802" x2="663.0" y2="795.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="802" x2="663.0" y2="809.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">true，显示待接收</text><line x1="910.0" y1="859" x2="1000.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="859" x2="1000.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="877" x2="910.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="877" x2="923.0" y2="870.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="877" x2="923.0" y2="884.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">写出返回后，接收配置并裁剪过期队列</text><line x1="910.0" y1="916" x2="1170.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1157.0" y2="923.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1157.0" y2="909.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">configure，清旧采样/冷却；裁范围或切手动</text><line x1="8" y1="603" x2="8" y2="951" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="603" x2="1812" y2="951" stroke="#64748b" stroke-width="2" /><line x1="8" y1="951" x2="1812" y2="951" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1030" x2="1170.0" y2="1030" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1030" x2="1157.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1030" x2="1157.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">update，每500ms提供累计反馈及本期最长写出</text><text x="14" y="1078" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 真实长写阻塞或持续发送压力</text><line x1="8" y1="1059" x2="1812" y2="1059" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1144" x2="1260.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1144" x2="1260.0" y2="1162" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1162" x2="1170.0" y2="1162" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1162" x2="1183.0" y2="1155.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1162" x2="1183.0" y2="1169.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">较快下降，受下限及1.5秒冷却约束</text><line x1="8" y1="1173" x2="1812" y2="1173" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1192" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 处理慢/空闲/低负载</text><line x1="1170.0" y1="1258" x2="1260.0" y2="1258" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1258" x2="1260.0" y2="1276" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1276" x2="1170.0" y2="1276" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1276" x2="1183.0" y2="1269.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1276" x2="1183.0" y2="1283.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">保持目标，说明原因，不盲目上探</text><line x1="8" y1="1287" x2="1812" y2="1287" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1306" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 持续健康且有媒体负载</text><line x1="1170.0" y1="1372" x2="1260.0" y2="1372" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1372" x2="1260.0" y2="1390" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1390" x2="1170.0" y2="1390" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1390" x2="1183.0" y2="1383.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1390" x2="1183.0" y2="1397.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">连续稳定5秒，每3秒至多小步回升一次</text><line x1="8" y1="1059" x2="8" y2="1407" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="1059" x2="1812" y2="1407" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1407" x2="1812" y2="1407" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1486" x2="910.0" y2="1486" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="1486" x2="923.0" y2="1479.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1486" x2="923.0" y2="1493.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1475" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">计划目标、策略原因与升降次数</text><line x1="910.0" y1="1543" x2="1000.0" y2="1543" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1543" x2="1000.0" y2="1561" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1561" x2="910.0" y2="1561" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1561" x2="923.0" y2="1554.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1561" x2="923.0" y2="1568.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="1532" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">取下一视频，保留音视频原PTS</text><line x1="910.0" y1="1600" x2="1430.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1600" x2="1417.0" y2="1607.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1600" x2="1417.0" y2="1593.0" stroke="#64748b" stroke-width="2" /><text x="1170.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">目标改变时setVideoBitrate，再提交该帧</text><line x1="1430.0" y1="1657" x2="1690.0" y2="1657" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1657" x2="1677.0" y2="1664.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1657" x2="1677.0" y2="1650.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1646" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">交织写出与flush，期间不占队列锁</text><line x1="650.0" y1="1714" x2="910.0" y2="1714" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1714" x2="897.0" y2="1721.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1714" x2="897.0" y2="1707.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1703" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">阻塞时仍可入队/提交设置/读统计</text><line x1="1690.0" y1="1771" x2="910.0" y2="1771" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="910.0" y1="1771" x2="923.0" y2="1764.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1771" x2="923.0" y2="1778.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1760" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">返回/超时，记录耗时与真实字节</text><line x1="910.0" y1="1828" x2="1000.0" y2="1828" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1828" x2="1000.0" y2="1846" stroke="#64748b" stroke-width="2" /><line x1="1000.0" y1="1846" x2="910.0" y2="1846" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1846" x2="923.0" y2="1839.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1846" x2="923.0" y2="1853.0" stroke="#64748b" stroke-width="2" /><text x="918.0" y="1817" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">更新计划/提交目标/实际压缩码率及升降计数</text><line x1="650.0" y1="1885" x2="390.0" y2="1885" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1885" x2="403.0" y2="1878.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1885" x2="403.0" y2="1892.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1874" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">最多5Hz显示策略原因及目标差异</text><line x1="130.0" y1="1942" x2="650.0" y2="1942" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1942" x2="637.0" y2="1949.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1942" x2="637.0" y2="1935.0" stroke="#64748b" stroke-width="2" /><text x="390.0" y="1931" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止直播</text><line x1="650.0" y1="1999" x2="910.0" y2="1999" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1999" x2="897.0" y2="2006.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1999" x2="897.0" y2="1992.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="1988" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，清配置邮箱并取消IO</text><line x1="910.0" y1="2056" x2="1170.0" y2="2056" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="2056" x2="1157.0" y2="2063.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="2056" x2="1157.0" y2="2049.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="2045" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">run结束，策略及编码/网络资源析构</text><line x1="910.0" y1="2113" x2="650.0" y2="2113" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="2113" x2="663.0" y2="2106.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="2113" x2="663.0" y2="2120.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="2102" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">completed或failed，随后finished解锁重启</text><rect x="1090.5" y="2143" width="419.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1300.0" y="2165" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">ABR是应用层反馈，不能撤回TCP旧字节或把本机IO码率当可用带宽</text></svg>