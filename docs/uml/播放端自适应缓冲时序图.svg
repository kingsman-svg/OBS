<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="2718" viewBox="0 0 1820 2718"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">播放端自适应缓冲时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">观众</text><line x1="130.0" y1="135" x2="130.0" y2="2683" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SessionController GUI</text><line x1="390.0" y1="135" x2="390.0" y2="2683" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MediaPlayer解码线程</text><line x1="650.0" y1="135" x2="650.0" y2="2683" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">PlaybackBuffer普通策略</text><line x1="910.0" y1="135" x2="910.0" y2="2683" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">WASAPI输出线程</text><line x1="1170.0" y1="135" x2="1170.0" y2="2683" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1318.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Windows音频设备</text><line x1="1430.0" y1="135" x2="1430.0" y2="2683" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1578.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1690.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">独立视频窗口</text><line x1="1690.0" y1="135" x2="1690.0" y2="2683" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">播放直播</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin清状态，start后open</text><line x1="650.0" y1="289" x2="1170.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="289" x2="1157.0" y2="296.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="289" x2="1157.0" y2="282.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin直播自适应，清队列后start</text><line x1="1170.0" y1="346" x2="910.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="923.0" y2="339.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="923.0" y2="353.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin目标50ms，范围50至150ms</text><line x1="650.0" y1="403" x2="1170.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="403" x2="1157.0" y2="410.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="403" x2="1157.0" y2="396.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">push解码PCM及原PTS</text><line x1="650.0" y1="460" x2="910.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="460" x2="897.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="460" x2="897.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">push内持音频锁记录交付间隙与PTS间隔</text><line x1="650.0" y1="517" x2="740.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="517" x2="740.0" y2="535" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="535" x2="650.0" y2="535" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="535" x2="663.0" y2="528.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="535" x2="663.0" y2="542.0" stroke="#64748b" stroke-width="2" /><text x="658.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">保存独立GPU纹理，最多16帧和500ms跨度</text><line x1="1170.0" y1="574" x2="1260.0" y2="574" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="574" x2="1260.0" y2="592" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="592" x2="1170.0" y2="592" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="592" x2="1183.0" y2="585.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="592" x2="1183.0" y2="599.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">等首张视频就绪和目标PCM</text><line x1="1170.0" y1="631" x2="1430.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="631" x2="1417.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="631" x2="1417.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">预填最多30ms，Start</text><line x1="390.0" y1="688" x2="650.0" y2="688" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="688" x2="637.0" y2="695.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="688" x2="637.0" y2="681.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">每10ms takeVideo</text><line x1="650.0" y1="745" x2="390.0" y2="745" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="745" x2="403.0" y2="738.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="745" x2="403.0" y2="752.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">按音频设备主时钟交付到期画面</text><line x1="390.0" y1="802" x2="1690.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="802" x2="1677.0" y2="809.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="802" x2="1677.0" y2="795.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">显示GPU纹理</text><rect x="895.0" y="832" width="290.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1040.0" y="854" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">播放期间持续采样，目标变化由消费动作落实</text><line x1="1170.0" y1="916" x2="910.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="916" x2="923.0" y2="909.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="916" x2="923.0" y2="923.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">每500ms采样水位与交付迟到</text><text x="14" y="964" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 交付迟到且低水位</text><line x1="8" y1="945" x2="1812" y2="945" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1030" x2="1170.0" y2="1030" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="1030" x2="1157.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1030" x2="1157.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">提高目标，冷却1秒，最多150ms</text><line x1="1170.0" y1="1087" x2="1430.0" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1087" x2="1417.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1087" x2="1417.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">受控排空后Stop/Reset，实际补足新目标再Start</text><line x1="8" y1="1116" x2="1812" y2="1116" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1135" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 连续健康5秒</text><line x1="910.0" y1="1201" x2="1170.0" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="1201" x2="1157.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1201" x2="1157.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">每2秒最多降低10ms，最低50ms</text><line x1="8" y1="945" x2="8" y2="1236" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="945" x2="1812" y2="1236" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1236" x2="1812" y2="1236" stroke="#64748b" stroke-width="2" /><text x="14" y="1306" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 实际断粮</text><line x1="8" y1="1287" x2="1812" y2="1287" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1372" x2="1430.0" y2="1372" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1372" x2="1417.0" y2="1379.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1372" x2="1417.0" y2="1365.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">不再填充，等padding播放完后Stop/Reset</text><line x1="1170.0" y1="1429" x2="910.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1429" x2="923.0" y2="1422.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="1429" x2="923.0" y2="1436.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">underrun提高恢复门槛，只计一次</text><line x1="1170.0" y1="1486" x2="1260.0" y2="1486" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1486" x2="1260.0" y2="1504" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1504" x2="1170.0" y2="1504" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1504" x2="1183.0" y2="1497.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1504" x2="1183.0" y2="1511.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1475" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">冻结媒体时钟，等待PCM达到新目标</text><line x1="390.0" y1="1543" x2="1690.0" y2="1543" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1543" x2="1677.0" y2="1550.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1543" x2="1677.0" y2="1536.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1532" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">保留画面，视频不独自前进</text><line x1="650.0" y1="1600" x2="1170.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1600" x2="1157.0" y2="1607.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1600" x2="1157.0" y2="1593.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">继续交付PCM</text><line x1="1170.0" y1="1657" x2="1430.0" y2="1657" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1657" x2="1417.0" y2="1664.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1657" x2="1417.0" y2="1650.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1646" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">原PTS重建映射，3ms淡入后Start</text><line x1="8" y1="1686" x2="1812" y2="1686" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1705" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 持续积压或硬裁剪</text><line x1="910.0" y1="1771" x2="1170.0" y2="1771" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="1771" x2="1157.0" y2="1778.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1771" x2="1157.0" y2="1764.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="1760" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">超目标持续500ms后允许追赶</text><line x1="1170.0" y1="1828" x2="1430.0" y2="1828" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1828" x2="1417.0" y2="1835.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1828" x2="1417.0" y2="1821.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1817" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">等旧padding排空，Stop/Reset</text><line x1="1170.0" y1="1885" x2="1260.0" y2="1885" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1885" x2="1260.0" y2="1903" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1903" x2="1170.0" y2="1903" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1903" x2="1183.0" y2="1896.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1903" x2="1183.0" y2="1910.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1874" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">只裁尚未提交PCM至目标，保留PTS</text><line x1="1170.0" y1="1942" x2="1430.0" y2="1942" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1942" x2="1417.0" y2="1949.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1942" x2="1417.0" y2="1935.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1931" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">重建媒体时钟后Start</text><line x1="8" y1="1287" x2="8" y2="1977" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="1287" x2="1812" y2="1977" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1977" x2="1812" y2="1977" stroke="#64748b" stroke-width="2" /><rect x="939.5" y="2029" width="461.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1170.0" y="2051" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">关闭声音时复用同一策略：视频预缓冲、冻结QPC映射、恢复及裁解码纹理</text><line x1="390.0" y1="2113" x2="650.0" y2="2113" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="2113" x2="637.0" y2="2120.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="2113" x2="637.0" y2="2106.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="2102" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stats，最多5Hz更新原状态标签</text><line x1="650.0" y1="2170" x2="390.0" y2="2170" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="2170" x2="403.0" y2="2163.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2170" x2="403.0" y2="2177.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="2159" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">目标、水位、升降、等待状态与次数</text><text x="14" y="2218" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 读包或端点失败</text><line x1="8" y1="2199" x2="1812" y2="2199" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="2284" x2="390.0" y2="2284" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="2284" x2="403.0" y2="2277.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2284" x2="403.0" y2="2291.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="2273" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">清资源后failed与finished，允许重试</text><line x1="8" y1="2313" x2="1812" y2="2313" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="2332" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 用户停止或退出</text><line x1="390.0" y1="2398" x2="650.0" y2="2398" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="2398" x2="637.0" y2="2405.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="2398" x2="637.0" y2="2391.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="2387" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop中断IO并关闭交付</text><line x1="650.0" y1="2455" x2="1170.0" y2="2455" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="2455" x2="1157.0" y2="2462.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="2455" x2="1157.0" y2="2448.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="2444" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop唤醒预缓冲，wait归还设备及COM</text><line x1="650.0" y1="2512" x2="390.0" y2="2512" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="2512" x2="403.0" y2="2505.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2512" x2="403.0" y2="2519.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="2501" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">completed，随后finished</text><line x1="8" y1="2199" x2="8" y2="2547" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="2199" x2="1812" y2="2547" stroke="#64748b" stroke-width="2" /><line x1="8" y1="2547" x2="1812" y2="2547" stroke="#64748b" stroke-width="2" /><rect x="455.5" y="2599" width="389.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="650.0" y="2621" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">下一轮begin重置目标及统计；点播与显式固定预算沿用原流程</text></svg>