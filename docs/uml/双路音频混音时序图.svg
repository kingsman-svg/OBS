<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1920" viewBox="0 0 2080 1920"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">双路音频混音时序图</text><rect x="18.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="130.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">用户</text><line x1="130.0" y1="135" x2="130.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="278.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="390.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MainWindow</text><line x1="390.0" y1="135" x2="390.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="538.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="650.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">SessionController</text><line x1="650.0" y1="135" x2="650.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="798.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="910.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">两路WasapiCapture</text><line x1="910.0" y1="135" x2="910.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1058.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1170.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">AudioMixer</text><line x1="1170.0" y1="135" x2="1170.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1318.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">每路AudioResampler</text><line x1="1430.0" y1="135" x2="1430.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1578.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1690.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">StereoLimiter普通对象</text><line x1="1690.0" y1="135" x2="1690.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1838.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1950.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">MediaTimeline</text><line x1="1950.0" y1="135" x2="1950.0" y2="1885" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">选择音频源，开始采集</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">captureRequested</text><line x1="650.0" y1="289" x2="1170.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="289" x2="1157.0" y2="296.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="289" x2="1157.0" y2="282.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin，清缓存，启用选中的输入路</text><line x1="650.0" y1="346" x2="910.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="897.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="897.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin，线程独立采集原始格式</text><line x1="910.0" y1="403" x2="650.0" y2="403" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="403" x2="663.0" y2="396.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="403" x2="663.0" y2="410.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">队列中的PCM、声道布局、QPC时间</text><line x1="650.0" y1="460" x2="1170.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="460" x2="1157.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="460" x2="1157.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">push(kind, packet)</text><line x1="1170.0" y1="517" x2="1430.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="517" x2="1417.0" y2="524.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="517" x2="1417.0" y2="510.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">convert，统一48kHz立体声并软补偿可信设备漂移</text><line x1="1430.0" y1="574" x2="1170.0" y2="574" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="574" x2="1183.0" y2="567.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="574" x2="1183.0" y2="581.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">可变长重采样包</text><line x1="1170.0" y1="631" x2="1260.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="631" x2="1260.0" y2="649" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="649" x2="1170.0" y2="649" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="649" x2="1183.0" y2="642.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="649" x2="1183.0" y2="656.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">首包建立QPC原点，每路最多缓存500ms</text><line x1="650.0" y1="688" x2="1170.0" y2="688" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="688" x2="1157.0" y2="695.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="688" x2="1157.0" y2="681.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">takeFrames(当前QPC)，留80ms对齐窗口</text><line x1="1170.0" y1="745" x2="1260.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="745" x2="1260.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="763" x2="1170.0" y2="763" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="763" x2="1183.0" y2="756.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="763" x2="1183.0" y2="770.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">按时间交集填480帧，缺包补零</text><line x1="1170.0" y1="802" x2="1260.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="802" x2="1260.0" y2="820" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="820" x2="1170.0" y2="820" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="820" x2="1183.0" y2="813.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="820" x2="1183.0" y2="827.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">每路480采样帧平滑音量/静音，浮点相加</text><line x1="1170.0" y1="859" x2="1690.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="859" x2="1677.0" y2="866.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="859" x2="1677.0" y2="852.0" stroke="#64748b" stroke-width="2" /><text x="1430.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">push原10ms包，5ms预读/左右共用增益</text><line x1="1690.0" y1="916" x2="1170.0" y2="916" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="916" x2="1183.0" y2="909.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1183.0" y2="923.0" stroke="#64748b" stroke-width="2" /><text x="1430.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">首包等待；后续交付前一有效包和实际RMS</text><line x1="1170.0" y1="973" x2="650.0" y2="973" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="973" x2="663.0" y2="966.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="973" x2="663.0" y2="980.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">固定10ms包与连续样本时间戳</text><line x1="650.0" y1="1030" x2="740.0" y2="1030" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="1030" x2="740.0" y2="1048" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="1048" x2="650.0" y2="1048" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1048" x2="663.0" y2="1041.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1048" x2="663.0" y2="1055.0" stroke="#64748b" stroke-width="2" /><text x="658.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">emit mixedAudioReady，保留混音诊断</text><line x1="650.0" y1="1087" x2="1950.0" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1087" x2="1937.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1087" x2="1937.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">pushAudio，共同原点换算PTS</text><line x1="650.0" y1="1144" x2="1950.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1144" x2="1937.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="1950.0" y1="1144" x2="1937.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">takeFrames，总等待120ms包含80ms对齐和一包预读</text><line x1="1950.0" y1="1201" x2="650.0" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="1201" x2="663.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1201" x2="663.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">synchronizedAudioReady，后续编码入口</text><line x1="650.0" y1="1258" x2="390.0" y2="1258" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1258" x2="403.0" y2="1251.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1258" x2="403.0" y2="1265.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">显示RMS、限幅前超幅/联动增益和两路漂移统计</text><line x1="130.0" y1="1315" x2="390.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1315" x2="377.0" y2="1322.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1315" x2="377.0" y2="1308.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">改变音量或静音</text><line x1="390.0" y1="1372" x2="650.0" y2="1372" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="1372" x2="637.0" y2="1379.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1372" x2="637.0" y2="1365.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">audioMixChanged</text><line x1="650.0" y1="1429" x2="1170.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1429" x2="1157.0" y2="1436.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1429" x2="1157.0" y2="1422.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">setControl，从当前增益用10ms过渡到目标</text><text x="14" y="1477" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 一路设备或重采样失败</text><line x1="8" y1="1458" x2="2072" y2="1458" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1543" x2="1170.0" y2="1543" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1543" x2="1157.0" y2="1550.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1543" x2="1157.0" y2="1536.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1532" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">disable失败路，另一成功路继续</text><line x1="650.0" y1="1600" x2="390.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1600" x2="403.0" y2="1593.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1600" x2="403.0" y2="1607.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">保留失败说明</text><line x1="8" y1="1629" x2="2072" y2="1629" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="1648" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] GUI长时间停顿或缓存溢出</text><line x1="1170.0" y1="1714" x2="1260.0" y2="1714" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1714" x2="1260.0" y2="1732" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="1732" x2="1170.0" y2="1732" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1732" x2="1183.0" y2="1725.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1732" x2="1183.0" y2="1739.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="1703" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">丢弃旧包及过期限幅预读，最多追赶200ms并标记</text><line x1="8" y1="1458" x2="8" y2="1749" stroke="#64748b" stroke-width="2" /><line x1="2072" y1="1458" x2="2072" y2="1749" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1749" x2="2072" y2="1749" stroke="#64748b" stroke-width="2" /><rect x="862.5" y="1801" width="355.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1040.0" y="1823" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">静音仍消费时间，恢复不重放旧包；当前不监听回采声音</text></svg>