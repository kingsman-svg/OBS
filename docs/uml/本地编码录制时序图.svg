-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">解交错入FIFO、缺口补零、按AAC帧长编码</text><line x1="1950.0" y1="1600" x2="2210.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="2210.0" y1="1600" x2="2197.0" y2="1607.0" stroke="#64748b" stroke-width="2" /><line x1="2210.0" y1="1600" x2="2197.0" y2="1593.0" stroke="#64748b" stroke-width="2" /><text x="2080.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">包PTS/DTS从编码时间基换成流时间基后写入</text><line x1="1430.0" y1="1657" x2="1170.0" y2="1657" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1657" x2="1183.0" y2="1650.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1657" x2="1183.0" y2="1664.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1646" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">更新统计，继续消费或条件变量等待</text><line x1="8" y1="774" x2="8" y2="1692" stroke="#64748b" stroke-width="2" /><line x1="2332" y1="774" x2="2332" y2="1692" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1692" x2="2332" y2="1692" stroke="#64748b" stroke-width="2" /><rect x="1108.5" y="1744" width="383.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1300.0" y="1766" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">push/stop在GUI快速执行，run独占GPU/FFmpeg/文件资源</text></svg>