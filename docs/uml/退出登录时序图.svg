3.0" y2="353.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">changed</text><line x1="650.0" y1="403" x2="390.0" y2="403" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="403" x2="403.0" y2="396.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="403" x2="403.0" y2="410.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">返回登录页</text><line x1="910.0" y1="460" x2="1170.0" y2="460" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="460" x2="1157.0" y2="467.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="460" x2="1157.0" y2="453.0" stroke="#64748b" stroke-width="2" /><text x="1040.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">changed</text><line x1="1170.0" y1="517" x2="1260.0" y2="517" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="517" x2="1260.0" y2="535" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="535" x2="1170.0" y2="535" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="535" x2="1183.0" y2="528.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="535" x2="1183.0" y2="542.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">停止到期定时器，清除待处理请求</text><line x1="1170.0" y1="574" x2="1260.0" y2="574" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="574" x2="1260.0" y2="592" stroke="#64748b" stroke-width="2" /><line x1="1260.0" y1="592" x2="1170.0" y2="592" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="592" x2="1183.0" y2="585.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="592" x2="1183.0" y2="599.0" stroke="#64748b" stroke-width="2" /><text x="1178.0" y="563" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">停止采集交付，异步请求工作线程退出</text><line x1="1170.0" y1="631" x2="1430.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="631" x2="1417.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="631" x2="1417.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">disconnectFromServer</text><line x1="1430.0" y1="688" x2="1520.0" y2="688" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="688" x2="1520.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="706" x2="1430.0" y2="706" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="706" x2="1443.0" y2="699.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="706" x2="1443.0" y2="713.0" stroke="#64748b" stroke-width="2" /><text x="1438.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">停止心跳和请求定时器，abort socket</text><line x1="1430.0" y1="745" x2="1170.0" y2="745" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1170.0" y1="745" x2="1183.0" y2="738.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="745" x2="1183.0" y2="752.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">disconnected，清空房间状态</text><line x1="1690.0" y1="802" x2="1780.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="802" x2="1780.0" y2="820" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="820" x2="1690.0" y2="820" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="820" x2="1703.0" y2="813.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="820" x2="1703.0" y2="827.0" stroke="#64748b" stroke-width="2" /><text x="1454.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">连接断开，清理成员或关闭主播房间</text><line x1="1690.0" y1="859" x2="1780.0" y2="859" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="859" x2="1780.0" y2="877" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="877" x2="1690.0" y2="877" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1690.0" y1="877" x2="1703.0" y2="870.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="877" x2="1703.0" y2="884.0" stroke="#64748b" stroke-width="2" /><text x="1376.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">向剩余观众发送 room.closed 或 room.updated</text><rect x="1135.5" y="889" width="329.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="1300.0" y="911" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">签名令牌暂未中心撤销，但退出客户端不再保留凭据</text></svg>