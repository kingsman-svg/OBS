2" /><text x="1430.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">Player解码线程</text><line x1="1430.0" y1="135" x2="1430.0" y2="2170" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="1578.0" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="1690.0" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">WASAPI线程</text><line x1="1690.0" y1="135" x2="1690.0" y2="2170" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="130.0" y1="175" x2="390.0" y2="175" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="175" x2="377.0" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">开始直播</text><line x1="390.0" y1="232" x2="650.0" y2="232" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="232" x2="637.0" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin保存低延迟预算，清状态后start</text><line x1="650.0" y1="289" x2="1170.0" y2="289" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="289" x2="1157.0" y2="296.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="289" x2="1157.0" y2="282.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">avio_open2，测TCP/RTMP建连耗时</text><line x1="650.0" y1="346" x2="910.0" y2="346" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="897.0" y2="353.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="346" x2="897.0" y2="339.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="335" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">open，200ms VBV/1秒GOP/无B帧及前瞻</text><text x="14" y="394" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 连接或设备初始化失败</text><line x1="8" y1="375" x2="1812" y2="375" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="460" x2="740.0" y2="460" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="460" x2="740.0" y2="478" stroke="#64748b" stroke-width="2" /><line x1="740.0" y1="478" x2="650.0" y2="478" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="478" x2="663.0" y2="471.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="478" x2="663.0" y2="485.0" stroke="#64748b" stroke-width="2" /><text x="658.0" y="449" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">RAII释放本轮资源</text><line x1="650.0" y1="517" x2="390.0" y2="517" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="517" x2="403.0" y2="510.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="517" x2="403.0" y2="524.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">failed，随后finished允许重启</text><line x1="8" y1="546" x2="1812" y2="546" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="565" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 初始化成功</text><line x1="650.0" y1="631" x2="1170.0" y2="631" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="631" x2="1157.0" y2="638.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="631" x2="1157.0" y2="624.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">FLV头就绪，交织阈值40ms与IO刷新</text><line x1="650.0" y1="688" x2="390.0" y2="688" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="688" x2="403.0" y2="681.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="688" x2="403.0" y2="695.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">opened，就绪时长</text><line x1="390.0" y1="745" x2="650.0" y2="745" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="745" x2="637.0" y2="752.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="745" x2="637.0" y2="738.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="734" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">交付同步GPU帧与PCM</text><line x1="650.0" y1="802" x2="910.0" y2="802" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="802" x2="897.0" y2="809.0" stroke="#64748b" stroke-width="2" /><line x1="910.0" y1="802" x2="897.0" y2="795.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">手动/ABR改目标时保留200ms VBV，再编码</text><line x1="910.0" y1="859" x2="650.0" y2="859" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="650.0" y1="859" x2="663.0" y2="852.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="859" x2="663.0" y2="866.0" stroke="#64748b" stroke-width="2" /><text x="780.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">H.264/AAC编码包</text><line x1="650.0" y1="916" x2="1170.0" y2="916" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1157.0" y2="923.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="916" x2="1157.0" y2="909.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="905" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">交织写包与flush，记录首次媒体写出</text><line x1="8" y1="375" x2="8" y2="951" stroke="#64748b" stroke-width="2" /><line x1="1812" y1="375" x2="1812" y2="951" stroke="#64748b" stroke-width="2" /><line x1="8" y1="951" x2="1812" y2="951" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1030" x2="1430.0" y2="1030" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1030" x2="1417.0" y2="1037.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1030" x2="1417.0" y2="1023.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1019" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin直播播放，清统计并start</text><line x1="1430.0" y1="1087" x2="1170.0" y2="1087" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1087" x2="1183.0" y2="1080.0" stroke="#64748b" stroke-width="2" /><line x1="1170.0" y1="1087" x2="1183.0" y2="1094.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1076" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">RTMP拉流，短探测与50ms接收缓冲请求</text><line x1="1430.0" y1="1144" x2="1690.0" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1144" x2="1677.0" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1144" x2="1677.0" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">begin，50ms预缓冲，等待首张视频转换完成</text><line x1="1170.0" y1="1201" x2="1430.0" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1430.0" y1="1201" x2="1417.0" y2="1208.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1201" x2="1417.0" y2="1194.0" stroke="#64748b" stroke-width="2" /><text x="1300.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">媒体包</text><line x1="1430.0" y1="1258" x2="1520.0" y2="1258" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="1258" x2="1520.0" y2="1276" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="1276" x2="1430.0" y2="1276" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1276" x2="1443.0" y2="1269.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1276" x2="1443.0" y2="1283.0" stroke="#64748b" stroke-width="2" /><text x="1438.0" y="1247" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">GPU解码/转换，记录首张解码耗时</text><line x1="1430.0" y1="1315" x2="1690.0" y2="1315" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1315" x2="1677.0" y2="1322.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1315" x2="1677.0" y2="1308.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1304" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">交付PCM，队列最多120ms</text><line x1="1690.0" y1="1372" x2="1780.0" y2="1372" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="1372" x2="1780.0" y2="1390" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="1390" x2="1690.0" y2="1390" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1390" x2="1703.0" y2="1383.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1390" x2="1703.0" y2="1397.0" stroke="#64748b" stroke-width="2" /><text x="1331.0" y="1361" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">主动裁剪置缺口标记，跳到保留PTS，不用补零追逐队头</text><line x1="1690.0" y1="1429" x2="1780.0" y2="1429" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="1429" x2="1780.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="1780.0" y1="1447" x2="1690.0" y2="1447" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1447" x2="1703.0" y2="1440.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1447" x2="1703.0" y2="1454.0" stroke="#64748b" stroke-width="2" /><text x="1390.0" y="1418" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">请求30ms端点，读取实际容量，限制padding</text><line x1="1690.0" y1="1486" x2="1430.0" y2="1486" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="1430.0" y1="1486" x2="1443.0" y2="1479.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1486" x2="1443.0" y2="1493.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1475" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">实际播放主时钟与队列/追赶快照</text><line x1="1430.0" y1="1543" x2="1520.0" y2="1543" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="1543" x2="1520.0" y2="1561" stroke="#64748b" stroke-width="2" /><line x1="1520.0" y1="1561" x2="1430.0" y2="1561" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1561" x2="1443.0" y2="1554.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1561" x2="1443.0" y2="1568.0" stroke="#64748b" stroke-width="2" /><text x="1438.0" y="1532" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">视频保留300ms未来帧窗口，按音频时钟到期交付</text><line x1="390.0" y1="1600" x2="1430.0" y2="1600" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1600" x2="1417.0" y2="1607.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1600" x2="1417.0" y2="1593.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1589" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">takeVideo，记录首张交付耗时</text><line x1="1430.0" y1="1657" x2="390.0" y2="1657" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="1657" x2="403.0" y2="1650.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1657" x2="403.0" y2="1664.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1646" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">独立GPU纹理与原媒体PTS</text><line x1="390.0" y1="1714" x2="480.0" y2="1714" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1714" x2="480.0" y2="1732" stroke="#64748b" stroke-width="2" /><line x1="480.0" y1="1732" x2="390.0" y2="1732" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1732" x2="403.0" y2="1725.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1732" x2="403.0" y2="1739.0" stroke="#64748b" stroke-width="2" /><text x="398.0" y="1703" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">显示画面，诊断文本最多5Hz刷新</text><rect x="545.0" y="1744" width="470.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="780.0" y="1766" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">验收将编号画入像素，解码后识别同帧；测入队至GUI交付，不含显示器扫描</text><line x1="130.0" y1="1828" x2="390.0" y2="1828" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1828" x2="377.0" y2="1835.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="1828" x2="377.0" y2="1821.0" stroke="#64748b" stroke-width="2" /><text x="260.0" y="1817" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">停止</text><line x1="390.0" y1="1885" x2="650.0" y2="1885" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1885" x2="637.0" y2="1892.0" stroke="#64748b" stroke-width="2" /><line x1="650.0" y1="1885" x2="637.0" y2="1878.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="1874" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，关闭输入并取消IO</text><line x1="390.0" y1="1942" x2="1430.0" y2="1942" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1942" x2="1417.0" y2="1949.0" stroke="#64748b" stroke-width="2" /><line x1="1430.0" y1="1942" x2="1417.0" y2="1935.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="1931" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop，停止交付并取消读包/声音</text><line x1="1430.0" y1="1999" x2="1690.0" y2="1999" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1999" x2="1677.0" y2="2006.0" stroke="#64748b" stroke-width="2" /><line x1="1690.0" y1="1999" x2="1677.0" y2="1992.0" stroke="#64748b" stroke-width="2" /><text x="1560.0" y="1988" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">stop/wait，归还COM资源</text><line x1="650.0" y1="2056" x2="390.0" y2="2056" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="2056" x2="403.0" y2="2049.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2056" x2="403.0" y2="2063.0" stroke="#64748b" stroke-width="2" /><text x="520.0" y="2045" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">completed或failed，随后finished</text><line x1="1430.0" y1="2113" x2="390.0" y2="2113" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="390.0" y1="2113" x2="403.0" y2="2106.0" stroke="#64748b" stroke-width="2" /><line x1="390.0" y1="2113" x2="403.0" y2="2120.0" stroke="#64748b" stroke-width="2" /><text x="910.0" y="2102" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">completed或failed，随后finished</text></svg>