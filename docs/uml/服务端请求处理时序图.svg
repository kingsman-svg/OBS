<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1350" viewBox="0 0 1100 1350"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">服务端请求处理时序图</text><rect x="25.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="137.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">HTTP客户端</text><line x1="137.5" y1="135" x2="137.5" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="300.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="412.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">HttpServer</text><line x1="412.5" y1="135" x2="412.5" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="575.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="687.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">HttpParser</text><line x1="687.5" y1="135" x2="687.5" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="850.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="962.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">EventLoop</text><line x1="962.5" y1="135" x2="962.5" y2="1315" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="137.5" y1="175" x2="412.5" y2="175" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="275.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">TCP连接与请求字节</text><line x1="412.5" y1="232" x2="962.5" y2="232" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="232" x2="949.5" y2="239.0" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="232" x2="949.5" y2="225.0" stroke="#64748b" stroke-width="2" /><text x="687.5" y="221" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">设置可配置的绝对请求期限</text><line x1="412.5" y1="289" x2="687.5" y2="289" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="289" x2="674.5" y2="296.0" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="289" x2="674.5" y2="282.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="278" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">解析缓冲</text><text x="14" y="337" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 不完整</text><line x1="8" y1="318" x2="1092" y2="318" stroke="#64748b" stroke-width="2" /><line x1="687.5" y1="403" x2="412.5" y2="403" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="412.5" y1="403" x2="425.5" y2="396.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="403" x2="425.5" y2="410.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="392" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">保留半包等待后续字节</text><line x1="8" y1="432" x2="1092" y2="432" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="451" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 格式错误或超限</text><line x1="687.5" y1="517" x2="412.5" y2="517" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="412.5" y1="517" x2="425.5" y2="510.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="517" x2="425.5" y2="524.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="506" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">返回400或413或431</text><line x1="8" y1="546" x2="1092" y2="546" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="14" y="565" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 完整请求</text><line x1="687.5" y1="631" x2="412.5" y2="631" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="412.5" y1="631" x2="425.5" y2="624.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="631" x2="425.5" y2="638.0" stroke="#64748b" stroke-width="2" /><text x="550.0" y="620" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">消费完整请求</text><line x1="412.5" y1="688" x2="502.5" y2="688" stroke="#64748b" stroke-width="2" /><line x1="502.5" y1="688" x2="502.5" y2="706" stroke="#64748b" stroke-width="2" /><line x1="502.5" y1="706" x2="412.5" y2="706" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="706" x2="425.5" y2="699.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="706" x2="425.5" y2="713.0" stroke="#64748b" stroke-width="2" /><text x="420.5" y="677" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">标记已分发并调用业务路由</text><text x="26" y="736" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[alt] 普通同步JSON业务</text><line x1="20" y1="717" x2="1080" y2="717" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="802" x2="502.5" y2="802" stroke="#64748b" stroke-width="2" /><line x1="502.5" y1="802" x2="502.5" y2="820" stroke="#64748b" stroke-width="2" /><line x1="502.5" y1="820" x2="412.5" y2="820" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="820" x2="425.5" y2="813.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="820" x2="425.5" y2="827.0" stroke="#64748b" stroke-width="2" /><text x="420.5" y="791" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">原Handler适配为立即Reply</text><line x1="20" y1="831" x2="1080" y2="831" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><text x="26" y="850" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="start">[else] 异步业务</text><rect x="558.5" y="889" width="258.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="687.5" y="911" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">保存Reply，事件循环继续处理其他连接</text><line x1="962.5" y1="973" x2="412.5" y2="973" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="973" x2="425.5" y2="966.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="973" x2="425.5" y2="980.0" stroke="#64748b" stroke-width="2" /><text x="687.5" y="962" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">业务完成后在原loop调用Reply</text><line x1="20" y1="717" x2="20" y2="1008" stroke="#64748b" stroke-width="2" /><line x1="1080" y1="717" x2="1080" y2="1008" stroke="#64748b" stroke-width="2" /><line x1="20" y1="1008" x2="1080" y2="1008" stroke="#64748b" stroke-width="2" /><line x1="8" y1="318" x2="8" y2="1065" stroke="#64748b" stroke-width="2" /><line x1="1092" y1="318" x2="1092" y2="1065" stroke="#64748b" stroke-width="2" /><line x1="8" y1="1065" x2="1092" y2="1065" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="1144" x2="962.5" y2="1144" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="1144" x2="949.5" y2="1151.0" stroke="#64748b" stroke-width="2" /><line x1="962.5" y1="1144" x2="949.5" y2="1137.0" stroke="#64748b" stroke-width="2" /><text x="687.5" y="1133" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">取消请求期限并设置关闭兜底</text><line x1="412.5" y1="1201" x2="137.5" y2="1201" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="137.5" y1="1201" x2="150.5" y2="1194.0" stroke="#64748b" stroke-width="2" /><line x1="137.5" y1="1201" x2="150.5" y2="1208.0" stroke="#64748b" stroke-width="2" /><text x="275.0" y="1190" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">JSON或HTML响应与Connection close</text><rect x="549.0" y="1231" width="277.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="687.5" y="1253" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">请求超时强制关闭，重复或销毁后回复忽略</text></svg>