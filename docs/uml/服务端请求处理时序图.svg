<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1008" viewBox="0 0 1100 1008"><text x="35" y="46" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="26" text-anchor="start">服务端请求处理时序图</text><rect x="25.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="137.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">HTTP客户端</text><line x1="137.5" y1="135" x2="137.5" y2="973" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="300.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="412.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">HttpServer</text><line x1="412.5" y1="135" x2="412.5" y2="973" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="575.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="687.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">HttpParser</text><line x1="687.5" y1="135" x2="687.5" y2="973" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><rect x="850.5" y="80" width="224" height="55" fill="#e0f2fe" stroke="#334155" stroke-width="2" /><text x="962.5" y="113" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="middle">EventLoop</text><line x1="962.5" y1="135" x2="962.5" y2="973" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" /><line x1="137.5" y1="175" x2="412.5" y2="175" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="182.0" stroke="#64748b" stroke-width="2" /><line x1="412.5" y1="175" x2="399.5" y2="168.0" stroke="#64748b" stroke-width="2" /><text x="275.0" y="164" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">TCP连接与请求字节</text><line x1="412.5" y1="232" x2="962.5" y2="232" stroke=