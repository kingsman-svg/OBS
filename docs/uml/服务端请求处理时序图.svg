roke="#64748b" stroke-width="2" /><text x="275.0" y="848" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">JSON响应与Connection close</text><rect x="582.5" y="889" width="210.0" height="40" fill="#fef9c3" stroke="#334155" stroke-width="2" /><text x="687.5" y="911" fill="#1e293b" font-family="Microsoft YaHei, sans-serif" font-size="13" text-anchor="middle">不完整请求超时则强制关闭</text></svg>