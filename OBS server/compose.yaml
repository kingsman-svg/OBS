name: csn-obs
services:
  obs:
    container_name: OBS
    image: csn-obs-dev:24.04
    build: .
    user: root
    init: true
    restart: unless-stopped
    working_dir: /workspace
    environment:
      OBS_ROOT_PASSWORD: ${OBS_ROOT_PASSWORD:?请先创建本地 .env 文件}
    volumes:
      # 相对路径以本 compose 文件为基准，指向 Windows 上的 OBS server。
      - type: bind
        source: .
        target: /workspace
      # 完整仓库包含父目录 .git，远程 Git 在 /repo 操作；/workspace 保留原路径。
      - type: bind
        source: ..
        target: /repo
      # 重建容器时保留 VS Code Server、用户配置和 SSH 主机身份。
      - obs-root:/root
      - obs-ssh-keys:/etc/ssh/keys
    ports:
      - "127.0.0.1:2222:22"     # SSH / VS Code Remote - SSH
      - "127.0.0.1:8080:8080"   # 登录节点调度服务
      - "127.0.0.1:8081:8081"   # 登录节点 1
      - "127.0.0.1:8082:8082"   # 登录节点 2，验证调度
      - "127.0.0.1:9000:9000"   # TCP JSON 信令服务
      # 媒体端口1935/1985/8088/8000归独立SRS容器，见../SRS/compose.yaml。
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',22),2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  media:
    profiles: [media]
    container_name: OBS-MEDIA
    image: csn-obs-media:24.04-rtc0.24.6
    build:
      context: .
      dockerfile: Dockerfile.media
    init: true
    restart: unless-stopped
    working_dir: /repo/OBS server/code
    environment:
      OBS_TOKEN_SECRET_FILE: /auth/.config/obs/token-secret
    volumes:
      - type: bind
        source: ..
        target: /repo
      - obs-root:/auth:ro
    command: ["./build-media/obs_media_gateway", "--config", "media/config.json"]
    ports:
      - "127.0.0.1:8090:8090"             # 自建网关页面与 HTTP 会话 API
      - "127.0.0.1:8100-8109:8100-8109/udp" # 自建 WebRTC 媒体，与 SRS 的 8000 分开
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
volumes:
  obs-root:
  obs-ssh-keys:
